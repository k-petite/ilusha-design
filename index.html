const fmt  = n => n===0?"—":new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0}).format(Math.round(n))+" ₽";

const pct  = (a,b) => b===0?0:Math.min(100,Math.round(a/b*100));

// ── DERIVED CALCS ──

// actualCost per sub: paid > selected > planned
const actual = s => {
  if(!s) return 0;
  // If an active alternative is set, pull its paid/price
  if(s.activeAltId && s.alts && s.alts.length>0) {
    const a = s.alts.find(x=>x.id===s.activeAltId);
    if(a) {
      if(a.paid && +a.paid>0) return +a.paid;
      if(a.price && +a.price>0) return +a.price;
    }
  }
  if(s.paid && s.paid>0) return s.paid;
  if(s.selected && s.selected>0) return s.selected;
  return s.planned||0;
};
// Get selected/paid from active alt or sub fields
const subSelected = s => {
  if(!s) return 0;
  if(s.activeAltId && s.alts) {
    const a = s.alts.find(x=>x.id===s.activeAltId);
    if(a && a.price && +a.price>0) return +a.price;
  }
  return s.selected||0;
};
const subPaid = s => {
  if(!s) return 0;
  if(s.activeAltId && s.alts) {
    const a = s.alts.find(x=>x.id===s.activeAltId);
    if(a && a.paid && +a.paid>0) return +a.paid;
  }
  return s.paid||0;
};

function calcCat(cat) {
  const subs = cat.subs||[];
  const planned    = subs.reduce((s,x)=>s+(+x.planned||0), 0);
  const selected   = subs.reduce((s,x)=>s+(+x.selected||0), 0);
  const paid       = subs.reduce((s,x)=>s+(+x.paid||0), 0);
  const actualSum  = subs.reduce((s,x)=>s+actual(x), 0);
  const delta      = actualSum - planned;
  return { planned, selected, paid, actualSum, delta };
}

function calcProject(cats, roughData) {
  const rd = roughData || {planned:ROUGH_PLANNED, paid:0};
  const CEILING = TOTAL_BUDGET + BASE_RESERVE; // 4 000 000

  if(!cats||!cats.length) {
    const used = rd.planned;
    return {
      flexPlanned:0, flexActual:0, flexPaid:0, selected:0,
      totalPlanned:rd.planned, totalPaid:rd.paid||0, toPay:rd.planned,
      roughPlanned:rd.planned, roughPaid:rd.paid||0,
      used, available: CEILING - used,
      overBase: Math.max(0, used - TOTAL_BUDGET),
      savings:0, overruns:0,
    };
  }
  const allSubs      = cats.flatMap(c=>c.subs||[]);
  const flexPlanned  = allSubs.reduce((s,x)=>s+(+x.planned||0), 0);
  const selected     = allSubs.reduce((s,x)=>s+(+x.selected||0), 0);
  const flexPaid     = allSubs.reduce((s,x)=>s+(+x.paid||0), 0);
  const flexActual   = allSubs.reduce((s,x)=>s+actual(x), 0);
  const savings      = allSubs.reduce((s,x)=>s+Math.max(0,(+x.planned||0)-actual(x)), 0);
  const overruns     = allSubs.reduce((s,x)=>s+Math.max(0,actual(x)-(+x.planned||0)), 0);
  const totalPlanned = flexPlanned + rd.planned;
  const totalPaid    = flexPaid + (rd.paid||0);
  const toPay        = Math.max(0, flexActual - flexPaid) + Math.max(0, (rd.planned||ROUGH_PLANNED) - (rd.paid||0));

  // USED = actualCost всех позиций (план/подобрано/оплачено) + черновые
  const used      = flexActual + (rd.planned||ROUGH_PLANNED);
  // AVAILABLE = потолок 4М − использовано (реагирует на любое изменение)
  const available = CEILING - used;
  // Сколько вышли за исходный бюджет 3.5М (0 если не вышли)
  const overBase  = Math.max(0, used - TOTAL_BUDGET);

  return { flexPlanned, flexActual, flexPaid, selected,
           totalPlanned, totalPaid, toPay,
           roughPlanned:rd.planned, roughPaid:rd.paid||0,
           used, available, overBase,
           savings, overruns };
}

// ── DIFF BADGE — shows delta vs planned using actualCost ──
function DiffBadge({sub}){
  if(!sub) return null;
  const a = actual(sub);
  // only show diff if something is filled in beyond planned
  if(!sub.selected && !sub.paid) return null;
  const diff = a - (sub.planned||0);
  if(diff===0) return null;
  const over = diff > 0;
  return(
    <span style={{fontFamily:"'DM Mono',monospace",fontSize:10,padding:"1px 7px",borderRadius:8,
      background:over?"#FAE0D4":"#D4F0D4",color:over?"#8A2A1A":"#1A6A1A",flexShrink:0}}>
      {over?"🔴 +":"🟢 "}{fmt(Math.abs(diff))}
    </span>
  );
}

// ── ROOM PICKER ──
function RoomPicker({roomIds, onChange}){
  const ids = roomIds||[];
  const toggle = id => {
    if(id==="common"){
      // if selecting "whole apartment", clear others
      onChange(ids.includes("common")?[]:["common"]);
      return;
    }
    const next = ids.includes(id) ? ids.filter(r=>r!==id) : [...ids.filter(r=>r!=="common"),id];
    onChange(next);
  };
  return(
    <div>
      <div style={{fontFamily:"'DM Mono',monospace",fontSize:9,color:"#9A8A72",marginBottom:6}}>ПОМЕЩЕНИЯ</div>
      <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
        {ROOMS.map(r=>{
          const active=ids.includes(r.id);
          return(
            <button key={r.id} onClick={()=>toggle(r.id)}
              style={{background:active?"#2C2416":"none",color:active?"#F7F4EF":"#7A6A52",
                border:"1px solid",borderColor:active?"#2C2416":"#DDD5C4",
                padding:"3px 9px",borderRadius:12,cursor:"pointer",
                fontFamily:"'DM Mono',monospace",fontSize:10,transition:"all .15s"}}>
              {r.icon} {r.label}
            </button>
          );
        })}
      </div>
    </div>
  );
}

  const [tab,setTab]             = useState("overview");

  const [altModal,setAltModal]   = useState(null);
  const [newAlt,setNewAlt]       = useState({name:"",url:"",imageUrl:"",imageData:"",price:"",paid:"",comment:"",viewStatus:"none"});
  const [editAlt,setEditAlt]     = useState(null); // {catId,subId,altId}
  const [newCatModal,setNewCatModal]=useState(false);
  const [newCat,setNewCat]       = useState({name:"",icon:"📦"});
  const [filterRoom,setFilterRoom]   = useState("all");
  const [filterStatus,setFilterStatus]=useState("all");
  const [filterCat,setFilterCat]     = useState("all");
  const [saveStatus,setSaveStatus]=useState(null);
  const [lastSync,setLastSync]   = useState(null);
  const [fbReady,setFbReady]     = useState(!!window._fb);
  const [exportModal,setExportModal]=useState(false);
  const [exportText,setExportText]  =useState("");
  const saveTimer=useRef(null);
  const importRef=useRef();

  useEffect(()=>{
    if(window._fb){setFbReady(true);return;}
    const h=()=>setFbReady(true);
    window.addEventListener("firebase-ready",h);
    return()=>window.removeEventListener("firebase-ready",h);
  },[]);

  useEffect(()=>{
    if(!fbReady)return;
    const {db,ref,onValue}=window._fb;
    const unsub=onValue(ref(db,DB_KEY),snap=>{
      try {
        const val=snap.val();
        if(val&&val.cats){
          // Migrate: add missing fields to old data
          if(val.roughData) setRoughData(val.roughData);
          const migrated = val.cats.map(cat=>({
            ...cat,
            subs: (cat.subs||[]).map(sub=>({
              planned:0, selected:0, paid:0,
              status:"none", roomIds:[], url:"", imageUrl:"", imageData:"", comment:"", alts:[],
              ...sub,
              roomIds: sub.roomIds||[],
              alts: sub.alts||[],
            }))
          }));
          setCats(migrated);
        } else {
          setCats(DEFAULT_CATS);
        }
      } catch(e) {
        console.error("Load error:", e);
        setCats(DEFAULT_CATS);
      }
      setLastSync(new Date());
      setSaveStatus("saved");
      setTimeout(()=>setSaveStatus(null),2000);
    });
    return()=>unsub();
  },[fbReady]);

  useEffect(()=>{
    if(!cats||IS_VIEWER||!fbReady)return;
    clearTimeout(saveTimer.current);
    setSaveStatus("saving");
    saveTimer.current=setTimeout(async()=>{
      try{
        const {db,ref,set}=window._fb;
        await set(ref(db,DB_KEY),{cats, roughData});
        setSaveStatus("saved");
        setTimeout(()=>setSaveStatus(null),2000);
      }catch(e){setSaveStatus("error");}
    },800);
  },[cats,roughData,fbReady]);

  const handleExport=()=>{
    if(!cats)return;
    setExportText(JSON.stringify({cats,exportedAt:new Date().toISOString(),version:"ilusha-design-2026"},null,2));
    setExportModal(true);
  };

  const handleImport=e=>{
    const file=e.target.files[0];
    if(!file)return;
    const r=new FileReader();
    r.onload=async ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.cats)throw new Error("Неверный формат");
        if(!window.confirm("Загрузить данные? Текущие будут заменены."))return;
        const {db,ref,set}=window._fb;
        await set(ref(db,DB_KEY),{cats:data.cats});
        alert("✓ Загружено!");
      }catch(err){alert("Ошибка: "+err.message);}
    };
    r.readAsText(file);
    e.target.value="";
  };

  if(!cats) return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",
      fontFamily:"'DM Mono',monospace",fontSize:13,color:"#9A8A72",background:"#F7F4EF",gap:10}}>
      <span style={{fontSize:22}}>⏳</span>
      {fbReady?"Загружаю данные…":"Подключаюсь к Firebase…"}
    </div>
  );

  // ── DERIVED STATE ──
  // ── DERIVED (computed on every render, no useMemo) ──
  const proj = cats ? calcProject(cats, roughData) : calcProject([], roughData);

  const filteredCats = !cats ? [] : cats.map(cat=>{
    if(!cat||!cat.subs) return null;
    if(filterCat!=="all" && cat.id!==filterCat) return null;
    const filteredSubs = cat.subs.filter(sub=>{
      if(!sub) return false;
      const roomOk = filterRoom==="all" ||
        (sub.roomIds||[]).includes(filterRoom) ||
        (filterRoom==="common" && (sub.roomIds||[]).includes("common"));
      const statusOk = filterStatus==="all" || (sub.status||"none")===filterStatus;
      return roomOk && statusOk;
    });
    if(filteredSubs.length===0 && (filterRoom!=="all"||filterStatus!=="all")) return null;
    return {...cat, subs:filteredSubs};
  }).filter(Boolean);

  const isFiltered = filterRoom!=="all" || filterStatus!=="all" || filterCat!=="all";

  const updSub=(cid,sid,patch)=>
    setCats(p=>p.map(c=>c.id!==cid?c:{...c,subs:c.subs.map(s=>s.id!==sid?s:{...s,...patch})}));

  const addAlt=()=>{
    if(!altModal||!newAlt.name)return;
    const {catId,subId}=altModal;
    const sub=cats.find(c=>c.id===catId).subs.find(s=>s.id===subId);
    const altId=uid();
    updSub(catId,subId,{alts:[...(sub.alts||[]),{id:altId,...newAlt}]});
    setNewAlt({name:"",url:"",imageUrl:"",imageData:"",price:"",comment:""});
  };
  const removeAlt=(cid,sid,aid)=>{
    const sub=cats.find(c=>c.id===cid).subs.find(s=>s.id===sid);
    updSub(cid,sid,{alts:sub.alts.filter(a=>a.id!==aid)});
  };

  const M={fontFamily:"'DM Mono',monospace"};
  const card={background:"white",borderRadius:8,padding:"14px 16px",marginBottom:12,boxShadow:"0 1px 5px rgba(44,36,22,.07)"};

  return(
  <div style={{fontFamily:"'Cormorant Garamond',Georgia,serif",background:"#F7F4EF",minHeight:"100vh",color:"#2C2416",zoom:1.4}}>
  <style>{`
    *{box-sizing:border-box;}
    input[type=text],input[type=number],textarea,select{font-family:'DM Mono',monospace;font-size:11px;color:#2C2416;background:#FDFAF6;border:1px solid #DDD5C4;border-radius:3px;padding:4px 7px;}
    input:focus,textarea:focus,select:focus{outline:none;border-color:#C8A97E;background:white;}
    input[type=number]{width:100px;text-align:right;}
    .tab{background:none;border:none;padding:9px 13px;cursor:pointer;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.09em;color:#9A8A72;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;}
    .tab.on{color:#F7F4EF;border-bottom-color:#C8A97E;}
    .tab:hover:not(.on){color:#C8B89A;}
    .exp-btn{background:none;border:none;cursor:pointer;font-family:'DM Mono',monospace;font-size:10px;color:#C8A97E;display:flex;align-items:center;gap:5px;padding:0;}
    .exp-btn:hover{opacity:.7;}
    .sub-sep{border-bottom:1px solid #F5F0E8;padding:14px 0;}
    .sub-sep:last-child{border-bottom:none;}
    .ghost-btn{background:none;border:1px dashed #C8B89A;color:#9A8A72;padding:4px 10px;border-radius:4px;cursor:pointer;font-family:'DM Mono',monospace;font-size:10px;}
    .ghost-btn:hover{border-color:#C8A97E;color:#C8A97E;}
    .icon-btn{background:none;border:none;cursor:pointer;font-size:14px;padding:2px 4px;border-radius:3px;}
    .icon-btn:hover{background:#F0EAE0;}
    .overlay{position:fixed;inset:0;background:rgba(44,36,22,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
    .modal{background:white;border-radius:10px;padding:22px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;}
    .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-family:'DM Mono',monospace;font-size:10px;}
  `}</style>

  {/* ── HEADER ── */}
  <div style={{background:"#2C2416",color:"#F7F4EF",padding:"22px 18px 0"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
      <div style={{...M,fontSize:9,letterSpacing:".18em",color:"#C8A97E"}}>БЮДЖЕТ РЕМОНТА</div>
      <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",justifyContent:"flex-end"}}>
        {saveStatus==="saving"&&<span style={{...M,fontSize:10,padding:"3px 10px",borderRadius:10,background:"#FDF5E4",color:"#8A6A12"}}>сохраняю…</span>}
        {saveStatus==="saved"&&<span style={{...M,fontSize:10,padding:"3px 10px",borderRadius:10,background:"#E6F5EA",color:"#2A6A2A"}}>✓ сохранено</span>}
        {saveStatus==="error"&&<span style={{...M,fontSize:10,padding:"3px 10px",borderRadius:10,background:"#FAE0D4",color:"#8A2A1A"}}>⚠ ошибка</span>}
        {IS_VIEWER
          ? <><span style={{...M,fontSize:10,padding:"3px 10px",borderRadius:10,background:"#E6F1F8",color:"#1A5A7A"}}>👁 просмотр</span>
              {lastSync&&<span style={{...M,fontSize:9,color:"#6A5A42"}}>{lastSync.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}</span>}
              <button onClick={()=>window.location.reload()} style={{background:"none",border:"1px solid #4A6A7A",color:"#8ABACA",padding:"5px 10px",borderRadius:4,cursor:"pointer",...M,fontSize:10}}>↻</button>
            </>
          : <><button onClick={handleExport} style={{background:"none",border:"1px solid #4A6A5A",color:"#8ACAAA",padding:"5px 10px",borderRadius:4,cursor:"pointer",...M,fontSize:10}}>↓ экспорт</button>
              <button onClick={()=>importRef.current.click()} style={{background:"none",border:"1px solid #4A5A6A",color:"#8AAACA",padding:"5px 10px",borderRadius:4,cursor:"pointer",...M,fontSize:10}}>↑ импорт</button>
              <input ref={importRef} type="file" accept=".json" style={{display:"none"}} onChange={handleImport}/>
            </>
        }
      </div>
    </div>
    <h1 style={{fontWeight:300,fontSize:22,marginBottom:16}}>Ilusha Design 2026</h1>

    {/* ── HEADER SUMMARY ── */}
    {(()=>{
      const ceiling = TOTAL_BUDGET + BASE_RESERVE;
      const inBase  = proj.used <= TOTAL_BUDGET;
      const inCeil  = proj.used <= ceiling;
      const usedPct = Math.min(100, Math.round(proj.used / ceiling * 100));

      return(<div>
        {/* 4 main cards */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:10,marginBottom:12}}>

          {/* 1. Бюджет */}
          <div>
            <div style={{...M,fontSize:9,letterSpacing:".08em",color:"#8A7A62",marginBottom:4}}>БЮДЖЕТ</div>
            <div style={{fontSize:16,fontWeight:300,color:"#C8A97E"}}>{fmtK(TOTAL_BUDGET)}</div>
            <div style={{...M,fontSize:9,color:"#6A5A42",marginTop:2}}>
              потолок {fmtK(ceiling)}
            </div>
          </div>

          {/* 2. Использовано */}
          <div>
            <div style={{...M,fontSize:9,letterSpacing:".08em",color:"#8A7A62",marginBottom:4}}>ИСПОЛЬЗОВАНО</div>
            <div style={{fontSize:16,fontWeight:300,color:"#F7F4EF"}}>{fmtK(proj.used)}</div>
            <div style={{...M,fontSize:9,color:"#6A5A42",marginTop:2}}>
              план / подобрано / оплачено
            </div>
          </div>

          {/* 3. Доступно */}
          <div>
            <div style={{...M,fontSize:9,letterSpacing:".08em",color:"#8A7A62",marginBottom:4}}>ДОСТУПНО</div>
            <div style={{fontSize:16,fontWeight:300,
              color:!inCeil?"#F0A070":!inBase?"#F0C060":"#90D4A0"}}>
              {proj.available>=0?fmtK(proj.available):"−"+fmtK(-proj.available)}
            </div>
            <div style={{...M,fontSize:9,color:"#6A5A42",marginTop:2}}>
              {!inCeil
                ? "⛔ превышен потолок 4М"
                : !inBase
                  ? `⚠ из резерва: ${fmtK(proj.overBase)}`
                  : `в бюджете, резерв +${fmtK(TOTAL_BUDGET-proj.used)}`
              }
            </div>
          </div>

          {/* 4. К оплате */}
          <div>
            <div style={{...M,fontSize:9,letterSpacing:".08em",color:"#8A7A62",marginBottom:4}}>К ОПЛАТЕ</div>
            <div style={{fontSize:16,fontWeight:300,color:proj.toPay>0?"#F0C060":"#90D4A0"}}>
              {proj.toPay>0?fmtK(proj.toPay):"✓ всё"}
            </div>
            <div style={{...M,fontSize:9,color:"#6A5A42",marginTop:2}}>
              {proj.toPay>0?`оплачено ${fmtK(proj.totalPaid)}`:"\u00A0"}
            </div>
          </div>

        </div>

        {/* Progress bar: base budget | reserve zone */}
        <div style={{marginBottom:4}}>
          <div style={{height:6,background:"#3C3426",borderRadius:3,overflow:"hidden",position:"relative"}}>
            {/* Base budget zone */}
            <div style={{position:"absolute",left:0,top:0,height:"100%",
              width:`${TOTAL_BUDGET/ceiling*100}%`,
              borderRight:"1px solid #5A4A32"}}/>
            {/* Used fill */}
            <div style={{height:"100%",borderRadius:3,transition:"width .4s",
              width:`${usedPct}%`,
              background:!inCeil?"#E8937A":!inBase?"#E8C060":"#4A9A5A"}}/>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",...M,fontSize:9,color:"#6A5A42",marginTop:3}}>
            <span>0</span>
            <span style={{color:"#C8A97E"}}>3.5М</span>
            <span>4.0М</span>
          </div>
        </div>

        {/* Savings / overruns */}
        {(proj.savings>0||proj.overruns>0)&&(
          <div style={{display:"flex",gap:16,marginBottom:6,...M,fontSize:10}}>
            {proj.savings>0&&<span style={{color:"#90D4A0"}}>🟢 Экономия: {fmt(proj.savings)}</span>}
            {proj.overruns>0&&<span style={{color:"#F0A070"}}>🔴 Перерасход: {fmt(proj.overruns)}</span>}
          </div>
        )}
      </div>);
    })()}

    <div style={{display:"flex",borderTop:"1px solid #3C3426",marginTop:10,overflowX:"auto"}}>
      {[["overview","ОБЗОР"],["rough","ЧЕРНОВЫЕ"],["flexible","КАТЕГОРИИ"],["chart","ДИАГРАММА"]].map(([id,lbl])=>(
        <button key={id} className={`tab ${tab===id?"on":""}`} onClick={()=>setTab(id)}>{lbl}</button>
      ))}
    </div>
  </div>

  {/* ── CONTENT ── */}
  <div style={{padding:"14px 14px 48px"}}>

  {/* OVERVIEW */}
  {tab==="overview"&&(
    <div>
      <div style={card}>
        <div style={{...M,fontSize:10,color:"#9A8A72",letterSpacing:".1em",marginBottom:12}}>СТРУКТУРА БЮДЖЕТА</div>
        {[
          {name:"Черновые работы", planned:roughData.planned||ROUGH_PLANNED, selected:0, paid:roughData.paid||0, color:"#C8A97E", note:"А4РЕМОНТ", fixed:true},
          ...cats.map(c=>{const cc=calcCat(c);return{name:c.icon+" "+c.name,planned:cc.planned,actualSum:cc.actualSum,paid:cc.paid,delta:cc.delta,color:c.color};}),
        ].map((item,i)=>(
          <div key={i} style={{padding:"10px 0",borderBottom:"1px solid #F5F0E8"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:5}}>
              <div>
                <span style={{fontSize:14}}>{item.name}</span>
                {item.fixed&&<span className="badge" style={{background:"#EDE7DC",color:"#7A6A52",marginLeft:7}}>фикс</span>}
                {item.note&&<div style={{...M,fontSize:10,color:"#9A8A72",marginTop:1}}>{item.note}</div>}
              </div>
              <div style={{textAlign:"right",display:"flex",flexDirection:"column",gap:2,alignItems:"flex-end"}}>
                <div style={{...M,fontSize:13}}>{fmt(item.planned)}</div>
                {item.actualSum!==item.planned&&item.actualSum>0&&<div style={{...M,fontSize:11,color:"#5A9AB8"}}>фактически {fmt(item.actualSum)}</div>}
                {item.delta!==0&&item.delta!==undefined&&item.actualSum!==item.planned&&<span style={{fontFamily:"'DM Mono',monospace",fontSize:10,padding:"1px 7px",borderRadius:8,background:item.delta>0?"#FAE0D4":"#D4F0D4",color:item.delta>0?"#8A2A1A":"#1A6A1A",flexShrink:0}}>{item.delta>0?"🔴 +":"🟢 "}{fmt(Math.abs(item.delta))}</span>}
              </div>
            </div>
            <div style={{height:5,background:"#EDE7DC",borderRadius:3,overflow:"hidden"}}>
              <div style={{display:"flex",height:"100%"}}>
                {item.paid>0&&<div style={{width:`${pct(item.paid,item.planned||1)}%`,background:"#4A9A5A",transition:"width .4s"}}/>}
                {item.selected>item.paid&&<div style={{width:`${pct(Math.min(item.selected,item.planned)-item.paid,item.planned||1)}%`,background:item.color,transition:"width .4s"}}/>}
              </div>
            </div>
          </div>
        ))}
      </div>

      {/* Reserve card */}
      <div style={{...card,border:`2px solid ${proj.reserve<50000?"#E8937A":proj.reserve>BASE_RESERVE?"#A3C8A8":"#A3B899"}`,background:proj.reserve<50000?"#FEF0EC":proj.reserve>BASE_RESERVE?"#F0F8F0":"#F2F8F3"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
          <div>
            <div style={{...M,fontSize:10,letterSpacing:".1em",color:"#3A7A4A",marginBottom:4}}>🛡 РЕЗЕРВНЫЙ ФОНД</div>
            <div style={{fontSize:28,fontWeight:300,color:proj.reserve<50000?"#C05030":proj.reserve>BASE_RESERVE?"#1A6A1A":"#2A5A32"}}>{fmt(proj.reserve)}</div>
            <div style={{...M,fontSize:10,color:"#5A8A6A",marginTop:3}}>базовый {fmt(BASE_RESERVE)}</div>
          </div>
          <div style={{textAlign:"right"}}>
            {proj.savings>0&&<div style={{...M,fontSize:11,color:"#1A6A1A",marginBottom:4}}>+{fmt(proj.savings)} экономия</div>}
            {proj.overruns>0&&<div style={{...M,fontSize:11,color:"#8A2A1A"}}>−{fmt(proj.overruns)} перерасход</div>}
          </div>
        </div>
        <div style={{height:8,background:"#C8E8CC",borderRadius:4,overflow:"hidden"}}>
          <div style={{width:`${Math.min(100,pct(proj.reserve,BASE_RESERVE*1.5))}%`,height:"100%",
            background:proj.reserve<50000?"#E8937A":proj.reserve>BASE_RESERVE?"#4A9A5A":"#4A9A5A",borderRadius:4,transition:"width .5s"}}/>
        </div>
      </div>

      <div style={{...card,background:"#FDF5E4",border:"1px solid #E8D8A0"}}>
        <div style={{...M,fontSize:10,color:"#7A5A12",marginBottom:8}}>⚠ КЛЮЧЕВЫЕ МОМЕНТЫ</div>
        <ul style={{paddingLeft:16,fontSize:13,lineHeight:1.9,color:"#5A4A22"}}>
          <li>Потолки — заложено <b>100 000 ₽</b> в черновой. ⚠ Уточнить у подрядчика</li>
          <li>Резерв пополняется автоматически при экономии и уменьшается при перерасходе</li>
          <li>Базовая подушка безопасности: <b>{fmt(BASE_RESERVE)}</b></li>
        </ul>
      </div>
    </div>
  )}

  {/* ROUGH TAB */}
  {tab==="rough"&&(
    <div>
      {/* Summary card */}
      <div style={{...card,background:"#2C2416",color:"#F7F4EF",marginBottom:12}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
          {[
            {l:"ЗАПЛАНИРОВАНО", v:fmt(roughData.planned||ROUGH_PLANNED), c:"#F7F4EF"},
            {l:"ОПЛАЧЕНО",      v:fmt(roughData.paid||0),                c:roughData.paid>0?"#90D4A0":"#F7F4EF"},
            {l:"ОСТАТОК",       v:fmt(Math.max(0,(roughData.planned||ROUGH_PLANNED)-(roughData.paid||0))),
              c:(roughData.paid||0)>(roughData.planned||ROUGH_PLANNED)?"#F0A070":"#F7F4EF"},
          ].map(s=>(
            <div key={s.l}>
              <div style={{...M,fontSize:9,color:"#8A7A62",marginBottom:4}}>{s.l}</div>
              <div style={{fontSize:16,fontWeight:300,color:s.c}}>{s.v}</div>
            </div>
          ))}
        </div>
        {!IS_VIEWER&&(
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:14,paddingTop:12,borderTop:"1px solid #3C3426"}}>
            <div>
              <div style={{...M,fontSize:9,color:"#8A7A62",marginBottom:5}}>ВСЕГО ЗАПЛАНИРОВАНО (₽)</div>
              <input type="number" value={roughData.planned||""}
                placeholder={ROUGH_PLANNED}
                onChange={e=>setRoughData(p=>({...p,planned:+e.target.value||ROUGH_PLANNED}))}
                style={{width:"100%",background:"#3C3426",border:"1px solid #5A5040",color:"#F7F4EF",borderRadius:4}}/>
              <div style={{...M,fontSize:9,color:"#6A5A42",marginTop:3}}>по смете А4РЕМОНТ: {fmt(ROUGH_PLANNED)}</div>
            </div>
            <div>
              <div style={{...M,fontSize:9,color:"#8A7A62",marginBottom:5}}>ВСЕГО ОПЛАЧЕНО (₽)</div>
              <input type="number" value={roughData.paid||""}
                placeholder="0"
                onChange={e=>setRoughData(p=>({...p,paid:+e.target.value||0}))}
                style={{width:"100%",background:"#3C3426",border:"1px solid #5A5040",color:"#F7F4EF",borderRadius:4}}/>
            </div>
          </div>
        )}
      </div>

      {/* Group breakdown with paid per group */}
      {ROUGH_GROUPS.map(group=>{
        const groupPlanned=group.items.reduce((s,i)=>s+i.a,0);
        const groupPaid=(roughData.groupPaid||{})[group.g]||0;
        const isOpen=openRough[group.g];
        return(
          <div key={group.g} style={{...card,padding:"13px 15px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <button className="exp-btn" onClick={()=>setOpenRough(p=>({...p,[group.g]:!p[group.g]}))}>
                <span>{isOpen?"▾":"▸"}</span>
                <span style={{fontSize:15,color:"#2C2416",fontFamily:"'Cormorant Garamond',serif"}}>{group.g}</span>
                {group.g==="Потолки"&&<span className="badge" style={{background:"#FDF5E4",color:"#7A5A12"}}>уточнить</span>}
              </button>
              <div style={{display:"flex",alignItems:"center",gap:12}}>
                {groupPaid>0&&(
                  <span style={{...M,fontSize:11,color:"#4A9A5A"}}>оплачено {fmt(groupPaid)}</span>
                )}
                <span style={{...M,fontSize:13}}>{groupPlanned===0?"—":fmt(groupPlanned)}</span>
              </div>
            </div>
            <div style={{height:4,background:"#EDE7DC",borderRadius:3,overflow:"hidden",marginTop:6,marginBottom:groupPaid>0?4:0}}>
              <div style={{display:"flex",height:"100%"}}>
                <div style={{width:`${pct(groupPaid,groupPlanned||1)}%`,background:"#4A9A5A",borderRadius:3,transition:"width .4s"}}/>
                <div style={{width:`${pct(Math.max(0,groupPlanned-groupPaid),groupPlanned||1)}%`,background:"#C8A97E",transition:"width .4s"}}/>
              </div>
            </div>
            {!IS_VIEWER&&(
              <div style={{display:"flex",alignItems:"center",gap:8,marginTop:6}}>
                <span style={{...M,fontSize:10,color:"#9A8A72",flexShrink:0}}>Оплачено:</span>
                <input type="number" placeholder="0" value={groupPaid||""}
                  onChange={e=>setRoughData(p=>({...p,
                    groupPaid:{...(p.groupPaid||{}), [group.g]:+e.target.value||0},
                    paid: Object.entries({...(p.groupPaid||{}),[group.g]:+e.target.value||0})
                      .reduce((s,[,v])=>s+v,0)
                  }))}
                  style={{width:120}}/>
              </div>
            )}
            {isOpen&&(
              <div style={{marginTop:10,paddingTop:10,borderTop:"1px solid #F5F0E8"}}>
                {group.items.map(item=>(
                  <div key={item.n} style={{padding:"7px 0",borderBottom:"1px solid #F9F5F0"}}>
                    <div style={{display:"flex",justifyContent:"space-between"}}>
                      <span style={{fontSize:13,color:"#4A3A22"}}>{item.n}
                        {item.note&&<span style={{...M,fontSize:10,color:"#C8A050",marginLeft:6}}>{item.note}</span>}
                      </span>
                      <span style={{...M,fontSize:12}}>{item.a===0?"—":fmt(item.a)}</span>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}

                                            ].map(({field,label,ph,type})=>(
                                              <div key={field} style={{marginBottom:8}}>
                                                <div style={{...M,fontSize:9,color:"#9A8A72",marginBottom:3}}>{label}</div>
                                                <input type={type} placeholder={ph}
                                                  value={alt[field]||""}
                                                  onChange={e=>{
                                                    const updated = {...alt,[field]:e.target.value};
                                                    updSub(cat.id,sub.id,{alts:(sub.alts||[]).map(a=>a.id===alt.id?updated:a)});
                                                  }}
                                                  style={{width:"100%"}}/>
                                              </div>
                                            ))}
                                            <ImagePicker
                                              imageUrl={alt.imageUrl||""} imageData={alt.imageData||""} url={alt.url||""}
                                              onChange={patch=>{
                                                const updated={...alt,...patch};
                                                updSub(cat.id,sub.id,{alts:(sub.alts||[]).map(a=>a.id===alt.id?updated:a)});
                                              }}
                                            />
                                          </div>
                                        )}
                                      </div>
                                    </div>
                                  </div>
                                );
                              });
                            })()}
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}

                {/* + subcat button */}
                {!IS_VIEWER&&<button className="ghost-btn"
                  onClick={()=>setCats(p=>p.map(c=>c.id!==cat.id?c:{...c,subs:[...c.subs,mk("Новая подкатегория",0)]}))}
                  style={{marginTop:10,width:"100%",textAlign:"center"}}>+ подкатегория</button>}
              </div>
            )}
          </div>
        );
      })}

      {/* + category button */}
      {!IS_VIEWER&&<button className="ghost-btn" onClick={()=>setNewCatModal(true)}
        style={{width:"100%",textAlign:"center",padding:"10px",marginBottom:8,fontSize:12}}>
        + добавить категорию
      </button>}
    </div>
  )}

  {/* CHART */}
  {tab==="chart"&&(
    <div>
      <div style={card}>
        <div style={{...M,fontSize:10,color:"#9A8A72",letterSpacing:".1em",marginBottom:14}}>ЗАПЛАНИРОВАНО ПО КАТЕГОРИЯМ</div>
        {[
          {name:"Черновые работы", planned:ROUGH_PLANNED, selected:0, color:"#C8A97E"},
          ...cats.map(c=>{const cc=calcCat(c);return{name:c.icon+" "+c.name,planned:cc.planned,actualSum:cc.actualSum,paid:cc.paid,color:c.color};}),
        ].sort((a,b)=>b.planned-a.planned).map((item,i)=>(
          <div key={i} style={{marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:4,flexWrap:"wrap",gap:4}}>
              <span style={{fontSize:13}}>{item.name}</span>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <span style={{...M,fontSize:11,color:"#9A8A72"}}>план {fmt(item.planned)}</span>
                {item.actualSum!==item.planned&&<span style={{...M,fontSize:11,color:"#5A9AB8"}}>фактически {fmt(item.actualSum)}</span>}
              </div>
            </div>
            <div style={{height:16,background:"#EDE7DC",borderRadius:4,overflow:"hidden",position:"relative"}}>
              <div style={{position:"absolute",height:"100%",width:`${pct(item.planned,ROUGH_PLANNED)}%`,background:item.color,borderRadius:4,opacity:.5}}/>
              {item.actualSum!==item.planned&&<div style={{position:"absolute",height:"100%",width:`${pct(Math.min(item.actualSum,item.planned),ROUGH_PLANNED)}%`,background:item.color,borderRadius:4}}/>}
              {item.paid>0&&<div style={{position:"absolute",height:"100%",width:`${pct(item.paid,ROUGH_PLANNED)}%`,background:"#4A9A5A",borderRadius:4}}/>}
            </div>
          </div>
        ))}
      </div>

      <div style={card}>
        <div style={{...M,fontSize:10,color:"#9A8A72",letterSpacing:".1em",marginBottom:12}}>СТАТУСЫ ПО ПОЗИЦИЯМ</div>
        {STATUSES.map(st=>{
          const count=cats.flatMap(c=>c.subs).filter(s=>(s.status||"none")===st.id).length;
          if(!count)return null;
          return(
            <div key={st.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <span style={{...M,fontSize:11,padding:"2px 8px",borderRadius:8,background:st.bg,color:st.color}}>{st.label}</span>
              <span style={{...M,fontSize:13}}>{count} поз.</span>
            </div>
          );
        })}
      </div>
    </div>
  )}

  </div>

  {/* NEW CATEGORY MODAL */}
  {newCatModal&&(
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)setNewCatModal(false)}}>
      <div className="modal">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div style={{fontSize:18,fontWeight:300}}>Новая категория</div>
          <button className="icon-btn" style={{fontSize:18}} onClick={()=>setNewCatModal(false)}>✕</button>
        </div>
        {[{field:"icon",label:"ИКОНКА",ph:"🛋️"},{field:"name",label:"НАЗВАНИЕ *",ph:"Мебель для спальни"}].map(({field,label,ph})=>(
          <div key={field} style={{marginBottom:10}}>
            <div style={{...M,fontSize:9,color:"#9A8A72",marginBottom:4}}>{label}</div>
            <input type="text" placeholder={ph} value={newCat[field]} onChange={e=>setNewCat(p=>({...p,[field]:e.target.value}))} style={{width:"100%"}}/>
          </div>
        ))}
        <button onClick={()=>{
          if(!newCat.name)return;
          setCats(p=>[...p,{id:uid(),name:newCat.name,icon:newCat.icon||"📦",color:"#B8C8A8",subs:[mk("Новая подкатегория",0)]}]);
          setNewCat({name:"",icon:"📦"});setNewCatModal(false);
        }} style={{width:"100%",background:"#2C2416",color:"#F7F4EF",border:"none",padding:"10px",borderRadius:5,cursor:"pointer",...M,fontSize:11,marginTop:6}}>
          СОЗДАТЬ
        </button>
      </div>
    </div>
  )}

  {/* EXPORT MODAL */}
  {exportModal&&(
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)setExportModal(false)}}>
      <div className="modal" style={{maxWidth:520}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div style={{fontSize:16,fontWeight:300}}>Экспорт данных</div>
          <button className="icon-btn" style={{fontSize:18}} onClick={()=>setExportModal(false)}>✕</button>
        </div>
        <div style={{...M,fontSize:10,color:"#7A6A52",marginBottom:10,lineHeight:1.6}}>
          Скопируй текст → сохрани как .json или скинь мне в чат
        </div>
        <textarea readOnly value={exportText} onClick={e=>e.target.select()}
          style={{width:"100%",height:160,...M,fontSize:9,background:"#F5F0E8",border:"1px solid #DDD5C4",borderRadius:4,padding:8,resize:"vertical"}}/>
        <button onClick={()=>navigator.clipboard&&navigator.clipboard.writeText(exportText).then(()=>alert("Скопировано!")).catch(()=>alert("Выдели текст и нажми Ctrl+C"))}
          style={{width:"100%",marginTop:10,background:"#2C2416",color:"#F7F4EF",border:"none",padding:"10px",borderRadius:5,cursor:"pointer",...M,fontSize:11}}>
          📋 скопировать
        </button>
      </div>
    </div>
  )}

  {/* ADD VARIANT MODAL */}
  {!IS_VIEWER&&altModal&&(
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)setAltModal(null)}}>
      <div className="modal">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div style={{fontSize:18,fontWeight:300}}>Добавить вариант</div>
          <button className="icon-btn" style={{fontSize:18}} onClick={()=>setAltModal(null)}>✕</button>
        </div>
        {[
          {field:"name",   label:"НАЗВАНИЕ *",       ph:"Диван Massimo MODERNO", type:"text"},
          {field:"url",    label:"ССЫЛКА",            ph:"https://...",            type:"text"},
          {field:"price",  label:"ПОДОБРАНО (₽)",    ph:"190000",                type:"number"},
          {field:"paid",   label:"ОПЛАЧЕНО (₽)",     ph:"0",                     type:"number"},
          {field:"comment",label:"КОММЕНТАРИЙ",      ph:"Цвет, размер, срок...", type:"text"},
        ].map(({field,label,ph,type})=>(
          <div key={field} style={{marginBottom:10}}>
            <div style={{...M,fontSize:9,color:"#9A8A72",marginBottom:4}}>{label}</div>
            <input type={type} placeholder={ph} value={newAlt[field]}
              onChange={e=>setNewAlt(p=>({...p,[field]:e.target.value}))} style={{width:"100%"}}/>
          </div>
        ))}
        <div style={{marginBottom:14}}>
          <ImagePicker imageUrl={newAlt.imageUrl} imageData={newAlt.imageData} url={newAlt.url}
            onChange={patch=>setNewAlt(p=>({...p,...patch}))}/>
        </div>
        <button onClick={addAlt}
          style={{width:"100%",background:"#2C2416",color:"#F7F4EF",border:"none",padding:"10px",
            borderRadius:5,cursor:"pointer",...M,fontSize:11}}>
          ДОБАВИТЬ ВАРИАНТ
        </button>
      </div>
    </div>
  )}

  </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
