const fmtK = n => n<=0 ? "—" : (n>=1e6?(n/1e6).toFixed(1)+"М":Math.round(n/1e3)+"К")+" ₽";
const pct  = (a,b) => b===0 ? 0 : Math.min(100,Math.round(a/b*100));

// ── IMAGE PICKER ──
function ImagePicker({imageUrl,imageData,onChange}){
  const [drag,setDrag]=useState(false);
  const ref=useRef(); const zone=useRef();
  const load=f=>{
    if(!f||!f.type.startsWith("image/"))return;
    const r=new FileReader();
    r.onload=e=>onChange({imageData:e.target.result,imageUrl:""});
    r.readAsDataURL(f);
  };
  const src=imageData||imageUrl||null;
  return(
    <div>
      <div style={{fontFamily:"'DM Mono',monospace",fontSize:9,color:"#9A8A72",marginBottom:6}}>ИЗОБРАЖЕНИЕ</div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        <div ref={zone} tabIndex={0}
          onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)}
          onDrop={e=>{e.preventDefault();setDrag(false);load(e.dataTransfer.files[0]);}}
          onPaste={e=>{const img=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith("image/"));if(img){e.preventDefault();load(img.getAsFile());}}}
          onClick={()=>{if(!src)ref.current.click();else zone.current.focus();}}
          style={{width:80,height:80,borderRadius:8,flexShrink:0,cursor:"pointer",outline:"none",
            border:drag?"2px dashed #C8A97E":"2px dashed #DDD5C4",
            background:drag?"#FDF5E4":"#FDFAF6",display:"flex",alignItems:"center",
            justifyContent:"center",overflow:"hidden",position:"relative"}}>
          {src ? <>
            <img src={src} alt="" style={{width:"100%",height:"100%",objectFit:"contain",background:"#F9F6F1"}}/>
            <button onClick={e=>{e.stopPropagation();onChange({imageData:"",imageUrl:""}); }}
              style={{position:"absolute",top:3,right:3,background:"rgba(44,36,22,.7)",border:"none",
                borderRadius:"50%",width:18,height:18,cursor:"pointer",color:"white",fontSize:10}}>✕</button>
          </> : <div style={{textAlign:"center",padding:6}}>
            <div style={{fontSize:18}}>📎</div>
            <div style={{fontFamily:"'DM Mono',monospace",fontSize:8,color:"#9A8A72",lineHeight:1.3}}>клик/тащи<br/>Ctrl+V</div>
          </div>}
        </div>
        <input ref={ref} type="file" accept="image/*" style={{display:"none"}} onChange={e=>load(e.target.files[0])}/>
        <div style={{flex:1,minWidth:130}}>
          <div style={{fontFamily:"'DM Mono',monospace",fontSize:9,color:"#9A8A72",marginBottom:3}}>ССЫЛКА НА КАРТИНКУ</div>
          <input type="text" placeholder="https://...jpg" value={imageUrl}
            onChange={e=>onChange({imageUrl:e.target.value,imageData:""})}
            style={{width:"100%",fontFamily:"'DM Mono',monospace",fontSize:11,padding:"4px 7px",
              border:"1px solid #DDD5C4",borderRadius:3,background:"#FDFAF6"}}/>
          {!src && <div style={{fontFamily:"'DM Mono',monospace",fontSize:9,color:"#AAA",marginTop:4,lineHeight:1.4}}>
            Скопируй картинку → кликни квадрат → Ctrl+V
          </div>}
        </div>
      </div>
    </div>
  );
}

// ── MAIN APP ──
function App(){
  const [cats,setCats]         = useState(null);
  const [tab,setTab]           = useState("overview");
  const [openCats,setOpenCats] = useState({});
  const [openSubs,setOpenSubs] = useState({});
  const [openRough,setOpenRough]=useState({});
  const [altModal,setAltModal] = useState(null);
  const [newAlt,setNewAlt]     = useState({name:"",url:"",imageUrl:"",imageData:"",price:"",comment:""});
  const [newCatModal,setNewCatModal]=useState(false);
  const [newCat,setNewCat]     = useState({name:"",icon:"📦",budget:""});
  const [saveStatus,setSaveStatus]=useState(null);
  const [lastSync,setLastSync] = useState(null);
  const [fbReady,setFbReady]   = useState(!!window._fb);
  const [exportModal,setExportModal]=useState(false);
  const [exportText,setExportText]  =useState("");
  const saveTimer=useRef(null);
  const importRef=useRef();

  useEffect(()=>{
    if(window._fb){setFbReady(true);return;}
    const h=()=>setFbReady(true);
    window.addEventListener("firebase-ready",h);
    return()=>window.removeEventListener("firebase-ready",h);
  },[]);

  useEffect(()=>{
    if(!fbReady)return;
    const {db,ref,onValue}=window._fb;
    const unsub=onValue(ref(db,DB_KEY),snap=>{
      const val=snap.val();
      if(val && val.cats){ setCats(val.cats); }
      else { setCats(DEFAULT_CATS); }
      setLastSync(new Date());
      setSaveStatus("saved");
      setTimeout(()=>setSaveStatus(null),2000);
    });
    return()=>unsub();
  },[fbReady]);

  useEffect(()=>{
    if(!cats||IS_VIEWER||!fbReady)return;
    clearTimeout(saveTimer.current);
    setSaveStatus("saving");
    saveTimer.current=setTimeout(async()=>{
      try{
        const {db,ref,set}=window._fb;
        await set(ref(db,DB_KEY),{cats});
        setSaveStatus("saved");
        setTimeout(()=>setSaveStatus(null),2000);
      }catch(e){setSaveStatus("error");}
    },800);
  },[cats,fbReady]);

  const handleExport=()=>{
    if(!cats)return;
    const data={cats,exportedAt:new Date().toISOString(),version:"ilusha-design-2026"};
    setExportText(JSON.stringify(data,null,2));
    setExportModal(true);
  };

  const handleImport=e=>{
    const file=e.target.files[0];
    if(!file)return;
    const r=new FileReader();
    r.onload=async ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.cats)throw new Error("Неверный формат");
        if(!window.confirm("Загрузить данные? Текущие будут заменены."))return;
        const {db,ref,set}=window._fb;
        await set(ref(db,DB_KEY),{cats:data.cats});
        alert("✓ Загружено!");
      }catch(err){alert("Ошибка: "+err.message);}
    };
    r.readAsText(file);
    e.target.value="";
  };

  if(!cats) return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",
      fontFamily:"'DM Mono',monospace",fontSize:13,color:"#9A8A72",background:"#F7F4EF",gap:10}}>
      <span style={{fontSize:22}}>⏳</span>
      {fbReady?"Загружаю данные…":"Подключаюсь к Firebase…"}
    </div>
  );

  // ── COMPUTED ──
  const flexTotal    = cats.reduce((s,c)=>s+c.budget,0);
  const allocated    = ROUGH+flexTotal;
  const reserve      = TOTAL+SAFETY-allocated; // динамический резерв
  const overBudget   = allocated > TOTAL+SAFETY;
  const totalPlanned = cats.flatMap(c=>c.subs).reduce((s,x)=>s+x.planned,0);
  const totalSel     = cats.flatMap(c=>c.subs).reduce((s,x)=>s+x.selected,0);
  const totalPaid    = cats.flatMap(c=>c.subs).reduce((s,x)=>s+x.paid,0);
  const maxBar       = Math.max(...cats.map(c=>c.budget),ROUGH);

  // updSub: when "planned" changes, auto-update category budget to match sum of all planned
  const updSub=(cid,sid,patch)=>{
    setCats(p=>p.map(c=>{
      if(c.id!==cid) return c;
      const newSubs = c.subs.map(s=>{
        if(s.id!==sid) return s;
        const updated = {...s,...patch};
        // Floor: planned can't go below selected
        if(patch.planned !== undefined){
          updated.planned = Math.max(updated.selected||0, +patch.planned||0);
        }
        return updated;
      });
      // Auto-sync budget = sum of all planned (if any planned > 0)
      const sumPlanned = newSubs.reduce((s,x)=>s+(x.planned||0),0);
      const newBudget = sumPlanned > 0 ? sumPlanned : c.budget;
      return {...c, subs:newSubs, budget:newBudget};
    }));
  };

  const handleCatBudget=(catId,newVal)=>{
    const cat=cats.find(c=>c.id===catId);
    const floor=cat.subs.reduce((s,x)=>s+x.selected,0);
    const clamped=Math.max(floor,+newVal);
    const diff=clamped-cat.budget;
    if(reserve-diff<0)return; // can't exceed 4M
    setCats(p=>p.map(c=>c.id!==catId?c:{...c,budget:clamped}));
  };

  const addAlt=()=>{
    if(!altModal||!newAlt.name)return;
    const {catId,subId}=altModal;
    const sub=cats.find(c=>c.id===catId).subs.find(s=>s.id===subId);
    updSub(catId,subId,{alts:[...(sub.alts||[]),{id:uid(),...newAlt}]});
    setNewAlt({name:"",url:"",imageUrl:"",imageData:"",price:"",comment:""});
  };

  const removeAlt=(cid,sid,aid)=>{
    const sub=cats.find(c=>c.id===cid).subs.find(s=>s.id===sid);
    updSub(cid,sid,{alts:sub.alts.filter(a=>a.id!==aid)});
  };

  // ── STYLE HELPERS ──
  const M={fontFamily:"'DM Mono',monospace"};
  const card={background:"white",borderRadius:8,padding:"14px 16px",marginBottom:12,boxShadow:"0 1px 5px rgba(44,36,22,.07)"};
  const barBg={height:5,background:"#EDE7DC",borderRadius:3,overflow:"hidden"};

  return(
  <div style={{fontFamily:"'Cormorant Garamond',Georgia,serif",background:"#F7F4EF",minHeight:"100vh",color:"#2C2416",zoom:1.4}}>
  <style>{`
    *{box-sizing:border-box;}
    input,textarea{font-family:'DM Mono',monospace;font-size:11px;color:#2C2416;background:#FDFAF6;border:1px solid #DDD5C4;border-radius:3px;padding:4px 7px;}
    input:focus,textarea:focus{outline:none;border-color:#C8A97E;background:white;}
    input[type=number]{width:90px;text-align:right;}
    input[type=range]{-webkit-appearance:none;width:100%;height:2px;background:#DDD5C4;border-radius:2px;outline:none;cursor:pointer;}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;cursor:pointer;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,.2);}
    .tab{background:none;border:none;padding:9px 13px;cursor:pointer;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.09em;color:#9A8A72;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;}
    .tab.on{color:#F7F4EF;border-bottom-color:#C8A97E;}
    .tab:hover:not(.on){color:#C8B89A;}
    .exp-btn{background:none;border:none;cursor:pointer;font-family:'DM Mono',monospace;font-size:10px;color:#C8A97E;display:flex;align-items:center;gap:5px;padding:0;}
    .exp-btn:hover{opacity:.7;}
    .sub-sep{border-bottom:1px solid #F5F0E8;padding:12px 0;}
    .sub-sep:last-child{border-bottom:none;}
    .ghost-btn{background:none;border:1px dashed #C8B89A;color:#9A8A72;padding:4px 10px;border-radius:4px;cursor:pointer;font-family:'DM Mono',monospace;font-size:10px;}
    .ghost-btn:hover{border-color:#C8A97E;color:#C8A97E;}
    .icon-btn{background:none;border:none;cursor:pointer;font-size:14px;padding:2px 4px;border-radius:3px;}
    .icon-btn:hover{background:#F0EAE0;}
    .overlay{position:fixed;inset:0;background:rgba(44,36,22,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
    .modal{background:white;border-radius:10px;padding:22px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;}
    .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-family:'DM Mono',monospace;font-size:10px;}
  `}</style>

  {/* HEADER */}
  <div style={{background:"#2C2416",color:"#F7F4EF",padding:"22px 18px 0"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
      <div style={{...M,fontSize:9,letterSpacing:".18em",color:"#C8A97E"}}>БЮДЖЕТ РЕМОНТА</div>
      <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",justifyContent:"flex-end"}}>
        {saveStatus==="saving"&&<div style={{...M,fontSize:10,padding:"3px 10px",borderRadius:10,background:"#FDF5E4",color:"#8A6A12"}}>сохраняю…</div>}
        {saveStatus==="saved"&&<div style={{...M,fontSize:10,padding:"3px 10px",borderRadius:10,background:"#E6F5EA",color:"#2A6A2A"}}>✓ сохранено</div>}
        {saveStatus==="error"&&<div style={{...M,fontSize:10,padding:"3px 10px",borderRadius:10,background:"#FAE0D4",color:"#8A2A1A"}}>⚠ ошибка</div>}
        {IS_VIEWER
          ? <><div style={{...M,fontSize:10,padding:"3px 10px",borderRadius:10,background:"#E6F1F8",color:"#1A5A7A"}}>👁 просмотр</div>
              {lastSync&&<div style={{...M,fontSize:9,color:"#6A5A42"}}>{lastSync.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}</div>}
              <button onClick={()=>window.location.reload()} style={{background:"none",border:"1px solid #4A6A7A",color:"#8ABACA",padding:"5px 12px",borderRadius:4,cursor:"pointer",...M,fontSize:10}}>↻</button>
            </>
          : <><button onClick={handleExport} style={{background:"none",border:"1px solid #4A6A5A",color:"#8ACAAA",padding:"5px 12px",borderRadius:4,cursor:"pointer",...M,fontSize:10}}>↓ экспорт</button>
              <button onClick={()=>importRef.current.click()} style={{background:"none",border:"1px solid #4A5A6A",color:"#8AAACA",padding:"5px 12px",borderRadius:4,cursor:"pointer",...M,fontSize:10}}>↑ импорт</button>
              <input ref={importRef} type="file" accept=".json" style={{display:"none"}} onChange={handleImport}/>
            </>
        }
      </div>
    </div>
    <h1 style={{fontWeight:300,fontSize:22,marginBottom:14}}>Ilusha Design 2026</h1>

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:8,marginBottom:14}}>

            <div key={s.l}>
              <div style={{...M,fontSize:9,color:"#8A7A62",marginBottom:3}}>{s.l}</div>
              <div style={{...M,fontSize:13}}>{s.v>0?fmt(s.v):"—"}</div>
            </div>
          ))}
        </div>
      </div>
      {!IS_VIEWER&&<button className="ghost-btn" onClick={()=>setNewCatModal(true)}
        style={{width:"100%",textAlign:"center",padding:"10px",marginBottom:8,fontSize:12}}>
        + добавить категорию
      </button>}
    </div>
  )}

  {/* CHART */}
  {tab==="chart" && (
    <div>
      <div style={card}>
        <div style={{...M,fontSize:10,color:"#9A8A72",letterSpacing:".1em",marginBottom:14}}>ВСЕ КАТЕГОРИИ</div>
        {[
          {name:"Черновые работы", amount:ROUGH,   color:"#C8A97E"},
          ...cats.map(c=>({name:c.icon+" "+c.name,amount:c.budget,color:c.color})),
          {name:"🛡 Резерв",       amount:reserve, color:"#A3B899"},
        ].sort((a,b)=>b.amount-a.amount).map((item,i)=>(
          <div key={i} style={{marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
              <span style={{fontSize:13}}>{item.name}</span>
              <span style={{...M,fontSize:11}}>{fmt(item.amount)} <span style={{color:"#9A8A72"}}>({pct(item.amount,TOTAL)}%)</span></span>
            </div>
            <div style={{height:18,background:"#EDE7DC",borderRadius:4,overflow:"hidden"}}>
              <div style={{width:`${(item.amount/ROUGH)*100}%`,height:"100%",background:item.color,borderRadius:4,transition:"width .5s"}}/>
            </div>
          </div>
        ))}
      </div>
    </div>
  )}

  </div>

  {/* NEW CATEGORY MODAL */}
  {newCatModal&&(
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)setNewCatModal(false)}}>
      <div className="modal">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div style={{fontSize:18,fontWeight:300}}>Новая категория</div>
          <button className="icon-btn" style={{fontSize:18}} onClick={()=>setNewCatModal(false)}>✕</button>
        </div>
        {[{field:"icon",label:"ИКОНКА",ph:"🛋️"},{field:"name",label:"НАЗВАНИЕ *",ph:"Мебель для спальни"},{field:"budget",label:"БЮДЖЕТ (₽)",ph:"150000"}].map(({field,label,ph})=>(
          <div key={field} style={{marginBottom:10}}>
            <div style={{...M,fontSize:9,color:"#9A8A72",marginBottom:4}}>{label}</div>
            <input type="text" placeholder={ph} value={newCat[field]} onChange={e=>setNewCat(p=>({...p,[field]:e.target.value}))} style={{width:"100%"}}/>
          </div>
        ))}
        <button onClick={()=>{
          if(!newCat.name)return;
          setCats(p=>[...p,{id:uid(),name:newCat.name,icon:newCat.icon||"📦",color:"#B8C8A8",budget:parseInt(newCat.budget)||0,subs:[mk("Новая подкатегория",0)]}]);
          setNewCat({name:"",icon:"📦",budget:""});setNewCatModal(false);
        }} style={{width:"100%",background:"#2C2416",color:"#F7F4EF",border:"none",padding:"10px",borderRadius:5,cursor:"pointer",...M,fontSize:11,marginTop:6}}>
          СОЗДАТЬ
        </button>
      </div>
    </div>
  )}

  {/* EXPORT MODAL */}
  {exportModal&&(
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)setExportModal(false)}}>
      <div className="modal" style={{maxWidth:520}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div style={{fontSize:16,fontWeight:300}}>Экспорт данных</div>
          <button className="icon-btn" style={{fontSize:18}} onClick={()=>setExportModal(false)}>✕</button>
        </div>
        <div style={{...M,fontSize:10,color:"#7A6A52",marginBottom:10,lineHeight:1.6}}>
          Скопируй текст → сохрани как .json или скинь мне в чат
        </div>
        <textarea readOnly value={exportText} onClick={e=>e.target.select()}
          style={{width:"100%",height:160,resize:"vertical",...M,fontSize:9,background:"#F5F0E8",border:"1px solid #DDD5C4",borderRadius:4,padding:8}}/>
        <button onClick={()=>navigator.clipboard&&navigator.clipboard.writeText(exportText).then(()=>alert("Скопировано!")).catch(()=>alert("Выдели текст и нажми Ctrl+C"))}
          style={{width:"100%",marginTop:10,background:"#2C2416",color:"#F7F4EF",border:"none",padding:"10px",borderRadius:5,cursor:"pointer",...M,fontSize:11}}>
          📋 скопировать
        </button>
      </div>
    </div>
  )}

  {/* ALT MODAL */}
  {!IS_VIEWER&&altModal&&(
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)setAltModal(null)}}>
      <div className="modal">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div style={{fontSize:18,fontWeight:300}}>Добавить альтернативу</div>
          <button className="icon-btn" style={{fontSize:18}} onClick={()=>setAltModal(null)}>✕</button>
        </div>
        {[{field:"name",label:"НАЗВАНИЕ *",ph:"Диван Massimo"},{field:"url",label:"ССЫЛКА",ph:"https://"},{field:"price",label:"ЦЕНА (₽)",ph:"190000"},{field:"comment",label:"КОММЕНТАРИЙ",ph:"Детали..."}].map(({field,label,ph})=>(
          <div key={field} style={{marginBottom:10}}>
            <div style={{...M,fontSize:9,color:"#9A8A72",marginBottom:4}}>{label}</div>
            <input type="text" placeholder={ph} value={newAlt[field]} onChange={e=>setNewAlt(p=>({...p,[field]:e.target.value}))} style={{width:"100%"}}/>
          </div>
        ))}
        <div style={{marginBottom:12}}>
          <ImagePicker imageUrl={newAlt.imageUrl} imageData={newAlt.imageData} url={newAlt.url} onChange={patch=>setNewAlt(p=>({...p,...patch}))}/>
        </div>
        <button onClick={addAlt} style={{width:"100%",background:"#2C2416",color:"#F7F4EF",border:"none",padding:"10px",borderRadius:5,cursor:"pointer",...M,fontSize:11}}>ДОБАВИТЬ</button>
      </div>
    </div>
  )}

  </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
