// ── IMAGE PICKER ──
function ImagePicker({imageUrl,imageData,url,onChange}){
  const [drag,setDrag]=useState(false);
  const ref=useRef(); const zoneRef=useRef();
  const handleFile=f=>{
    if(!f||!f.type.startsWith("image/"))return;
    const r=new FileReader();
    r.onload=e=>onChange({imageData:e.target.result,imageUrl:""});
    r.readAsDataURL(f);
  };
  const handlePaste=e=>{
    const img=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith("image/"));
    if(img){e.preventDefault();handleFile(img.getAsFile());}
  };
  const src=imageData||imageUrl||null;
  return(
    <div>
      <div style={{fontFamily:"'DM Mono',monospace",fontSize:9,color:"#9A8A72",marginBottom:6}}>ИЗОБРАЖЕНИЕ</div>
      <div style={{display:"flex",gap:10,alignItems:"flex-start",flexWrap:"wrap"}}>
        <div ref={zoneRef} tabIndex={0}
          onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)}
          onDrop={e=>{e.preventDefault();setDrag(false);handleFile(e.dataTransfer.files[0]);}}
          onPaste={handlePaste}
          onClick={()=>{if(!src)ref.current.click();else zoneRef.current?.focus();}}
          title="Клик / перетащи / Ctrl+V"
          style={{width:80,height:80,borderRadius:8,flexShrink:0,cursor:"pointer",outline:"none",
            border:drag?"2px dashed #C8A97E":"2px dashed #DDD5C4",
            background:drag?"#FDF5E4":"#FDFAF6",display:"flex",alignItems:"center",
            justifyContent:"center",overflow:"hidden",position:"relative",transition:"all .15s"}}>
          {src?<>
            <img src={src} alt="" style={{width:"100%",height:"100%",objectFit:"contain",background:"#F9F6F1"}}/>
            <button onClick={e=>{e.stopPropagation();onChange({imageData:"",imageUrl:""}); }}
              style={{position:"absolute",top:3,right:3,background:"rgba(44,36,22,.7)",border:"none",
                borderRadius:"50%",width:18,height:18,cursor:"pointer",color:"white",fontSize:10,
                display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
          </>:<div style={{textAlign:"center",padding:6}}>
            <div style={{fontSize:18,marginBottom:2}}>📎</div>
            <div style={{fontFamily:"'DM Mono',monospace",fontSize:8,color:"#9A8A72",lineHeight:1.4}}>
              клик / тащи<br/><b>Ctrl+V</b>
            </div>
          </div>}
        </div>
        <input ref={ref} type="file" accept="image/*" style={{display:"none"}} onChange={e=>handleFile(e.target.files[0])}/>
        <div style={{flex:1,minWidth:140,display:"flex",flexDirection:"column",gap:6}}>
          <div style={{fontFamily:"'DM Mono',monospace",fontSize:9,color:"#9A8A72",marginBottom:3}}>ССЫЛКА НА КАРТИНКУ</div>
          <input type="text" placeholder="https://...jpg" value={imageUrl}
            onChange={e=>onChange({imageUrl:e.target.value,imageData:""})}
            style={{width:"100%",fontFamily:"'DM Mono',monospace",fontSize:11,padding:"4px 7px",
              border:"1px solid #DDD5C4",borderRadius:3,background:"#FDFAF6"}}/>
          {!src&&<div style={{fontFamily:"'DM Mono',monospace",fontSize:9,color:"#BBA",lineHeight:1.5}}>
            Скопируй картинку на сайте → кликни квадрат → Ctrl+V
          </div>}
        </div>
      </div>
    </div>
  );
}

// ── SAVE BADGE ──
function SaveBadge({status,lastSync}){
  if(IS_VIEWER) return lastSync?(
    <div style={{fontFamily:"'DM Mono',monospace",fontSize:10,padding:"3px 10px",borderRadius:10,
      background:"#E6F1F8",color:"#1A5A7A"}}>
      👁 просмотр · {lastSync.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}
    </div>
  ):null;
  const s={saving:{bg:"#FDF5E4",c:"#8A6A12",t:"сохраняю…"},saved:{bg:"#E6F5EA",c:"#2A6A2A",t:"✓ сохранено"},
    error:{bg:"#FAE0D4",c:"#8A2A1A",t:"⚠ ошибка"}}[status];
  return s?<div style={{fontFamily:"'DM Mono',monospace",fontSize:10,padding:"3px 10px",
    borderRadius:10,background:s.bg,color:s.c}}>{s.t}</div>:null;
}

// ── MAIN APP ──
function App(){
  const [cats,setCats]           = useState(null);
  const [safetyBuf,setSafetyBuf] = useState(SAFETY);
  const [tab,setTab]             = useState("overview");
  const [openCats,setOpenCats]   = useState({});
  const [openSubs,setOpenSubs]   = useState({});
  const [openRough,setOpenRough] = useState({});
  const [altModal,setAltModal]   = useState(null);
  const [newAlt,setNewAlt]       = useState({name:"",url:"",imageUrl:"",imageData:"",price:"",comment:""});
  const [saveStatus,setSaveStatus]= useState(null);
  const [lastSync,setLastSync]   = useState(null);
  const [fbReady,setFbReady]     = useState(!!window._firebaseReady);
  const saveTimer = useRef(null);

  // Wait for Firebase to init
  useEffect(()=>{
    if(window._firebaseReady){ setFbReady(true); return; }
    const h=()=>setFbReady(true);
    window.addEventListener("firebase-ready",h);
    return()=>window.removeEventListener("firebase-ready",h);
  },[]);

  // Subscribe to Firebase once ready
  useEffect(()=>{
    if(!fbReady) return;
    const dbRef = window._firebaseRef(window._firebaseDb, DB_KEY);
    const unsub = window._firebaseOnValue(dbRef, snap=>{
      const val = snap.val();
      if(val){
        setCats(val.cats);
        if(val.safetyBuf !== undefined) setSafetyBuf(val.safetyBuf);
        setLastSync(new Date());
        setSaveStatus("saved");
        setTimeout(()=>setSaveStatus(null),2000);
      } else {
        setCats(DEFAULT_CATS);
        setSafetyBuf(SAFETY);
      }
    });
    return ()=>unsub();
  },[fbReady]);

  // Auto-save (editor only, debounced)
  useEffect(()=>{
    if(!cats||IS_VIEWER||!fbReady) return;
    clearTimeout(saveTimer.current);
    setSaveStatus("saving");
    saveTimer.current = setTimeout(async()=>{
      try{
        await window._firebaseSet(
          window._firebaseRef(window._firebaseDb, DB_KEY),
          {cats, safetyBuf}
        );
        setSaveStatus("saved");
        setTimeout(()=>setSaveStatus(null),2000);
      }catch(e){ setSaveStatus("error"); }
    },800);
  },[cats,safetyBuf,fbReady]);

  const handleReset=async()=>{
    if(!window.confirm("Сбросить все данные?"))return;
    await window._firebaseSet(window._firebaseRef(window._firebaseDb,DB_KEY),{
      cats:DEFAULT_CATS, safetyBuf:SAFETY
    });
  };

  if(!cats) return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",
      fontFamily:"'DM Mono',monospace",fontSize:13,color:"#9A8A72",background:"#F7F4EF",gap:10}}>
      <span style={{fontSize:20}}>⏳</span>
      {fbReady?"Загружаю данные…":"Подключаюсь к базе данных…"}
    </div>
  );

  // Computed
  const flexTotal     = cats.reduce((s,c)=>s+c.budget,0);
  const allocated     = ROUGH_TOTAL+flexTotal+safetyBuf;
  const overBudget    = allocated>TOTAL_BUDGET;
  const totalPlanned  = cats.flatMap(c=>c.subs).reduce((s,x)=>s+x.planned,0);
  const totalSelected = cats.flatMap(c=>c.subs).reduce((s,x)=>s+x.selected,0);
  const totalPaid     = cats.flatMap(c=>c.subs).reduce((s,x)=>s+x.paid,0);

  const updSub=(cid,sid,patch)=>
    setCats(p=>p.map(c=>c.id!==cid?c:{...c,subs:c.subs.map(s=>s.id!==sid?s:{...s,...patch})}));

  const handleCatBudget=(catId,newVal)=>{
    const cat=cats.find(c=>c.id===catId);
    const floor=cat.subs.reduce((s,x)=>s+x.selected,0);
    const clamped=Math.max(floor,newVal);
    const diff=clamped-cat.budget;
    if(safetyBuf-diff<0)return;
    setSafetyBuf(safetyBuf-diff);
    setCats(p=>p.map(c=>c.id!==catId?c:{...c,budget:clamped}));
  };

  const addAlt=()=>{
    if(!altModal||!newAlt.name)return;
    const {catId,subId}=altModal;
    const sub=cats.find(c=>c.id===catId).subs.find(s=>s.id===subId);
    updSub(catId,subId,{alts:[...(sub.alts||[]),{id:uid(),...newAlt}]});
    setNewAlt({name:"",url:"",imageUrl:"",imageData:"",price:"",comment:""});
  };
  const removeAlt=(cid,sid,aid)=>{
    const sub=cats.find(c=>c.id===cid).subs.find(s=>s.id===sid);
    updSub(cid,sid,{alts:sub.alts.filter(a=>a.id!==aid)});
  };

  const maxBar=Math.max(...cats.map(c=>c.budget),ROUGH_TOTAL);

  // ── inline styles helpers ──
  const card={background:"white",borderRadius:8,padding:"14px 16px",marginBottom:12,
    boxShadow:"0 1px 5px rgba(44,36,22,.07)"};
  const mono={fontFamily:"'DM Mono',monospace"};
  const barBg={height:5,background:"#EDE7DC",borderRadius:3,overflow:"hidden"};

  return(
  <div style={{fontFamily:"'Cormorant Garamond',Georgia,serif",background:"#F7F4EF",
    minHeight:"100vh",color:"#2C2416",zoom:1.4}}>
  <style>{`
    *{box-sizing:border-box;}
    input,textarea{font-family:'DM Mono',monospace;font-size:11px;color:#2C2416;
      background:#FDFAF6;border:1px solid #DDD5C4;border-radius:3px;padding:4px 7px;}
    input:focus,textarea:focus{outline:none;border-color:#C8A97E;background:white;}
    input[type=number]{width:90px;text-align:right;}
    input[type=range]{-webkit-appearance:none;width:100%;height:2px;background:#DDD5C4;
      border-radius:2px;outline:none;cursor:pointer;}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
      border-radius:50%;cursor:pointer;border:2px solid white;
      box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform .15s;}
    input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.25);}
    .tab{background:none;border:none;padding:9px 13px;cursor:pointer;
      font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.09em;
      color:#9A8A72;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;}
    .tab.on{color:#F7F4EF;border-bottom-color:#C8A97E;}
    .tab:hover:not(.on){color:#C8B89A;}
    .exp-btn{background:none;border:none;cursor:pointer;font-family:'DM Mono',monospace;
      font-size:10px;color:#C8A97E;display:flex;align-items:center;gap:5px;padding:0;transition:opacity .15s;}
    .exp-btn:hover{opacity:.7;}
    .sub-sep{border-bottom:1px solid #F5F0E8;padding:12px 0;}
    .sub-sep:last-child{border-bottom:none;}
    .ghost-btn{background:none;border:1px dashed #C8B89A;color:#9A8A72;padding:4px 10px;
      border-radius:4px;cursor:pointer;font-family:'DM Mono',monospace;font-size:10px;transition:all .15s;}
    .ghost-btn:hover{border-color:#C8A97E;color:#C8A97E;}
    .icon-btn{background:none;border:none;cursor:pointer;font-size:14px;
      padding:2px 4px;border-radius:3px;transition:background .15s;}
    .icon-btn:hover{background:#F0EAE0;}
    .overlay{position:fixed;inset:0;background:rgba(44,36,22,.5);z-index:100;
      display:flex;align-items:center;justify-content:center;padding:16px;}
    .modal{background:white;border-radius:10px;padding:22px;width:100%;
      max-width:420px;max-height:90vh;overflow-y:auto;}
    .badge{display:inline-block;padding:2px 8px;border-radius:10px;
      font-family:'DM Mono',monospace;font-size:10px;}
  `}</style>

  {/* HEADER */}
  <div style={{background:"#2C2416",color:"#F7F4EF",padding:"22px 18px 0"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
      <div style={{...mono,fontSize:9,letterSpacing:".18em",color:"#C8A97E"}}>БЮДЖЕТ РЕМОНТА</div>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <SaveBadge status={saveStatus} lastSync={lastSync}/>
        {!IS_VIEWER&&<button onClick={handleReset}
          style={{background:"none",border:"1px solid #6A4A4A",color:"#C89A9A",padding:"5px 12px",
            borderRadius:4,cursor:"pointer",fontFamily:"'DM Mono',monospace",fontSize:10}}>↩ сброс</button>}
        {IS_VIEWER&&<button onClick={()=>window.location.reload()}
          style={{background:"none",border:"1px solid #4A6A7A",color:"#8ABACA",padding:"5px 12px",
            borderRadius:4,cursor:"pointer",fontFamily:"'DM Mono',monospace",fontSize:10}}>↻ обновить</button>}
      </div>
    </div>
    <h1 style={{fontWeight:300,fontSize:22,marginBottom:14}}>Ilusha Design 2026</h1>

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:14}}>
      {[
        {l:"БЮДЖЕТ",       v:fmt(TOTAL_BUDGET)},
        {l:"РАСПРЕДЕЛЕНО", v:fmt(allocated), warn:overBudget},
        {l:overBudget?"ПРЕВЫШЕНИЕ":"СВОБОДНО", v:fmt(Math.abs(TOTAL_BUDGET-allocated)), warn:overBudget},

          {field:"url",    label:"ССЫЛКА",     ph:"https://..."},
          {field:"price",  label:"ЦЕНА (₽)",   ph:"190000"},
          {field:"comment",label:"КОММЕНТАРИЙ",ph:"Цвет, размер, срок..."},
        ].map(({field,label,ph})=>(
          <div key={field} style={{marginBottom:10}}>
            <div style={{...mono,fontSize:9,color:"#9A8A72",marginBottom:4}}>{label}</div>
            <input type="text" placeholder={ph} value={newAlt[field]}
              onChange={e=>setNewAlt(p=>({...p,[field]:e.target.value}))} style={{width:"100%"}}/>
          </div>
        ))}
        <div style={{marginBottom:12}}>
          <ImagePicker imageUrl={newAlt.imageUrl} imageData={newAlt.imageData} url={newAlt.url}
            onChange={patch=>setNewAlt(p=>({...p,...patch}))}/>
        </div>
        <button onClick={addAlt}
          style={{width:"100%",background:"#2C2416",color:"#F7F4EF",border:"none",padding:"10px",
            borderRadius:5,cursor:"pointer",fontFamily:"'DM Mono',monospace",fontSize:11}}>
          ДОБАВИТЬ
        </button>
      </div>
    </div>
  )}

  </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
