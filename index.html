// ── HELPERS ──
const fmt  = n => { const v=parseFloat(n); return (!v||isNaN(v))?"—":new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0}).format(Math.round(v))+" ₽"; };
const fmtK = n => { const v=parseFloat(n); if(!v||isNaN(v)||v<=0) return "—"; return (v>=1e6?(v/1e6).toFixed(1)+"М":Math.round(v/1e3)+"К")+" ₽"; };
const pct  = (a,b) => b===0?0:Math.min(100,Math.round(a/b*100));

// ── DERIVED CALCS ──

// actualCost per sub: paid > selected > planned
const toNum = v => { const n=parseFloat(v); return isNaN(n)?0:n; };
// Compute effective price for an alt (unitPrice * qty if set, else price)
const altPrice = a => {
  if(!a) return 0;
  const up = toNum(a.unitPrice);
  const qty = toNum(a.qty)||1;
  if(up>0) return up*qty;
  // legacy: price field (before unitPrice was introduced)
  return toNum(a.price);
};

// actualCost per sub: paid > selected > 0 (NOT planned — planned is budget, not actual)
// isSelected = true if sub has real price data (active alt with price, or paid/selected fields)
const isSelected = s => {
  if(!s) return false;
  if(s.activeAltId && s.alts && s.alts.length>0) {
    const a = s.alts.find(x=>x.id===s.activeAltId);
    if(a && (toNum(a.paid)>0 || altPrice(a)>0)) return true;
  }
  return toNum(s.paid)>0 || toNum(s.selected)>0;
};

const actual = s => {
  if(!s) return 0;
  // If an active alternative is set, pull its paid/price
  if(s.activeAltId && s.alts && s.alts.length>0) {
    const a = s.alts.find(x=>x.id===s.activeAltId);
    if(a) {
      if(toNum(a.paid)>0) return toNum(a.paid);
      const ap = altPrice(a);
      if(ap>0) return ap;
    }
  }
  if(toNum(s.paid)>0) return toNum(s.paid);
  if(toNum(s.selected)>0) return toNum(s.selected);
  // NO fallback to planned — unselected items don't count as "actual"
  return 0;
};
// Get selected/paid from active alt or sub fields
const subSelected = s => {
  if(!s) return 0;
  if(s.activeAltId && s.alts) {
    const a = s.alts.find(x=>x.id===s.activeAltId);
    const ap=altPrice(a); if(ap>0) return ap;
  }
  return s.selected||0;
};
const subPaid = s => {
  if(!s) return 0;
  if(s.activeAltId && s.alts) {
    const a = s.alts.find(x=>x.id===s.activeAltId);
    if(a && a.paid && +a.paid>0) return +a.paid;
  }
  return s.paid||0;
};

function calcCat(cat) {
  const subs = cat.subs||[];
  const planned    = subs.reduce((s,x)=>s+toNum(x.planned), 0);
  const selected   = subs.reduce((s,x)=>s+toNum(subSelected(x)), 0);
  const paid       = subs.reduce((s,x)=>s+toNum(subPaid(x)), 0);
  // actualSum = only items where something was actually selected/paid
  const actualSum  = subs.reduce((s,x)=>s+actual(x), 0);
  // delta = difference only for items that have been selected
  const selectedSubs = subs.filter(x=>isSelected(x));
  const plannedOfSelected = selectedSubs.reduce((s,x)=>s+toNum(x.planned), 0);
  const delta = actualSum - plannedOfSelected;
  const limit      = toNum(cat.limit) || 0;
  const overLimit  = limit > 0 ? actualSum - limit : 0;
  return { planned, selected, paid, actualSum, delta, limit, overLimit };
}

function calcProject(cats, roughData) {
  const rd = roughData || {planned:ROUGH_PLANNED, paid:0};
  const CEILING = TOTAL_BUDGET + BASE_RESERVE; // 4 000 000

  if(!cats||!cats.length) {
    const used = rd.planned;
    return {
      flexPlanned:0, flexActual:0, flexPaid:0, selected:0,
      totalPlanned:rd.planned, totalPaid:rd.paid||0, toPay:rd.planned,
      roughPlanned:rd.planned, roughPaid:rd.paid||0,
      used, available: CEILING - used,
      overBase: Math.max(0, used - TOTAL_BUDGET),
      savings:0, overruns:0,
    };
  }
  const allSubs      = cats.flatMap(c=>c.subs||[]);
  const flexPlanned  = allSubs.reduce((s,x)=>s+toNum(x.planned), 0);
  const selected     = allSubs.reduce((s,x)=>s+toNum(subSelected(x)), 0);
  const flexPaid     = allSubs.reduce((s,x)=>s+toNum(subPaid(x)), 0);
  const flexActual   = allSubs.reduce((s,x)=>s+actual(x), 0);
  // savings/overruns only for items that have been selected
  const savings  = allSubs.filter(isSelected).reduce((s,x)=>s+Math.max(0,toNum(x.planned)-actual(x)), 0);
  const overruns = allSubs.filter(isSelected).reduce((s,x)=>s+Math.max(0,actual(x)-toNum(x.planned)), 0);
  const totalPlanned = flexPlanned + rd.planned;
  const totalPaid    = flexPaid + (rd.paid||0);
  const toPay        = Math.max(0, flexActual - flexPaid) + Math.max(0, (rd.planned||ROUGH_PLANNED) - (rd.paid||0));

  // USED = actualCost всех позиций (план/подобрано) + черновые
  const used      = flexActual + (rd.planned||ROUGH_PLANNED);
  // AVAILABLE = потолок 4М − использовано (реагирует на любое изменение)
  const available = CEILING - used;
  // Сколько вышли за исходный бюджет 3.5М (0 если не вышли)
  const overBase  = Math.max(0, used - TOTAL_BUDGET);

  return { flexPlanned, flexActual, flexPaid, selected,
           totalPlanned, totalPaid, toPay,
           roughPlanned:rd.planned, roughPaid:rd.paid||0,
           used, available, overBase,
           savings, overruns };
}

function ImagePicker({imageUrl,imageData,onChange}){

    if(!f||!f.type.startsWith("image/"))return;
    const r=new FileReader();
    r.onload=e=>onChange({imageData:e.target.result,imageUrl:""});
    r.readAsDataURL(f);
  };
  const src=imageData||imageUrl||null;
  return(
    <div>
      <div style={{fontFamily:"'DM Mono',monospace",fontSize:9,color:"#9A8A72",marginBottom:6}}>ИЗОБРАЖЕНИЕ</div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        <div ref={zone} tabIndex={0}
          onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)}
          onDrop={e=>{e.preventDefault();setDrag(false);load(e.dataTransfer.files[0]);}}
          onPaste={e=>{const img=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith("image/"));if(img){e.preventDefault();load(img.getAsFile());}}}
          onClick={()=>{if(!src)ref.current.click();else zone.current.focus();}}
          style={{width:80,height:80,borderRadius:8,flexShrink:0,cursor:"pointer",outline:"none",
            border:drag?"2px dashed #C8A97E":"2px dashed #DDD5C4",
            background:drag?"#FDF5E4":"#FDFAF6",display:"flex",alignItems:"center",
            justifyContent:"center",overflow:"hidden",position:"relative"}}>
          {src?<>
            <img src={src} alt="" style={{width:"100%",height:"100%",objectFit:"contain",background:"#F9F6F1"}}/>
            <button onClick={e=>{e.stopPropagation();onChange({imageData:"",imageUrl:""}); }}
              style={{position:"absolute",top:3,right:3,background:"rgba(44,36,22,.7)",border:"none",
                borderRadius:"50%",width:18,height:18,cursor:"pointer",color:"white",fontSize:10}}>✕</button>
          </>:<div style={{textAlign:"center",padding:6}}>
            <div style={{fontSize:18}}>📎</div>
            <div style={{fontFamily:"'DM Mono',monospace",fontSize:8,color:"#9A8A72",lineHeight:1.3}}>клик/тащи<br/>Ctrl+V</div>
          </div>}
        </div>
        <input ref={ref} type="file" accept="image/*" style={{display:"none"}} onChange={e=>load(e.target.files[0])}/>
        <div style={{flex:1,minWidth:130}}>
          <div style={{fontFamily:"'DM Mono',monospace",fontSize:9,color:"#9A8A72",marginBottom:3}}>ССЫЛКА НА КАРТИНКУ</div>
          <input type="text" placeholder="https://...jpg" value={imageUrl}
            onChange={e=>onChange({imageUrl:e.target.value,imageData:""})}
            style={{width:"100%",fontFamily:"'DM Mono',monospace",fontSize:11,padding:"4px 7px",

          {!src&&<div style={{fontFamily:"'DM Mono',monospace",fontSize:9,color:"#AAA",marginTop:4,lineHeight:1.4}}>
            Скопируй картинку → кликни квадрат → Ctrl+V
          </div>}
        </div>
      </div>
    </div>
  );
}

// ── DIFF BADGE — shows delta vs planned using actualCost ──
function DiffBadge({sub}){
  if(!sub) return null;
  const a = actual(sub);
  // only show diff if something is filled in beyond planned
  if(!sub.selected && !sub.paid) return null;
  const diff = a - (sub.planned||0);
  if(diff===0) return null;
  const over = diff > 0;
  return(
    <span style={{fontFamily:"'DM Mono',monospace",fontSize:10,padding:"1px 7px",borderRadius:8,
      background:over?"#FAE0D4":"#D4F0D4",color:over?"#8A2A1A":"#1A6A1A",flexShrink:0}}>
      {over?"🔴 +":"🟢 "}{fmt(Math.abs(diff))}
    </span>
  );
}

// ── ROOM PICKER ──
function RoomPicker({roomIds, onChange}){
  const ids = roomIds||[];
  const toggle = id => {
    if(id==="common"){
      // if selecting "whole apartment", clear others
      onChange(ids.includes("common")?[]:["common"]);
      return;
    }
    const next = ids.includes(id) ? ids.filter(r=>r!==id) : [...ids.filter(r=>r!=="common"),id];
    onChange(next);
  };
  return(
    <div>
      <div style={{fontFamily:"'DM Mono',monospace",fontSize:9,color:"#9A8A72",marginBottom:6}}>ПОМЕЩЕНИЯ</div>
      <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
        {ROOMS.map(r=>{
          const active=ids.includes(r.id);
          return(
            <button key={r.id} onClick={()=>toggle(r.id)}
              style={{background:active?"#2C2416":"none",color:active?"#F7F4EF":"#7A6A52",
                border:"1px solid",borderColor:active?"#2C2416":"#DDD5C4",
                padding:"3px 9px",borderRadius:12,cursor:"pointer",
                fontFamily:"'DM Mono',monospace",fontSize:10,transition:"all .15s"}}>
              {r.icon} {r.label}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ── COLLAPSIBLE COMMENT ──
function AltComment({comment, M}){
  const [open,setOpen]=useState(false);
  if(!comment) return null;
  const LIMIT = 160;
  const short = comment.length>LIMIT && !open;
  return(
    <div style={{fontSize:11,color:"#7A6A52",fontStyle:"italic",marginTop:2,lineHeight:1.5}}>
      {short ? comment.slice(0,LIMIT)+"…" : comment}
      {comment.length>LIMIT&&(
        <button onClick={()=>setOpen(!open)}
          style={{background:"none",border:"none",cursor:"pointer",
            color:"#C8A97E",fontSize:10,marginLeft:4,padding:0,fontStyle:"normal",
            fontFamily:"'DM Mono',monospace"}}>
          {open?"свернуть":"ещё +"}
        </button>
      )}
    </div>
  );
}

// ── ILUSHA METER ──
function IlushaMeter({card,M}){
  const [ilusha,setIlusha]=useState(42);
  const [loaded,setLoaded]=useState(false);
  useEffect(()=>{
    if(!window._fb)return;
    const {db,ref,onValue}=window._fb;
    const unsub=onValue(ref(db,'ilusha-meter'),snap=>{
      const v=snap.val();
      if(v!==null&&!isNaN(+v)) setIlusha(+v);
      setLoaded(true);
    });
    return()=>unsub();
  },[]);
  const setAndSave=v=>{
    setIlusha(v);
    if(window._fb){const {db,ref,set}=window._fb; set(ref(db,'ilusha-meter'),v);}
  };
  const labels=[
    [0,15,"Точно сдаст/продаст 📦"],
    [15,35,"Скорее всего сдаст..."],
    [35,55,"Ещё не решил 🤔"],
    [55,75,"Начинает привыкать 🛋️"],
    [75,90,"Уже купил кота 🐱"],
    [90,101,"Будет жить сам! 🎊"],
  ];
  const label=labels.find(([a,b])=>ilusha>=a&&ilusha<b)?.[2]||"";
  const barColor=ilusha<35?"#E8937A":ilusha<65?"#D4C87E":"#4A9A5A";
  return(
    <div style={{...card,background:"#2C2416",color:"#F7F4EF",overflow:"hidden"}}>
      <div style={{...M,fontSize:10,letterSpacing:".12em",color:"#C8A97E",marginBottom:8}}>🏠 БАРОМЕТР ИЛЮШИ</div>
      <div style={{display:"flex",justifyContent:"space-between",...M,fontSize:10,color:"#8A7A62",marginBottom:8}}>
        <span>← сдаст/продаст</span><span>будет жить сам →</span>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:8}}>
        <div style={{flex:1,height:24,background:"#3C3426",borderRadius:12,overflow:"hidden",position:"relative"}}>
          <div style={{width:`${ilusha}%`,height:"100%",background:barColor,borderRadius:12,transition:"width .3s,background .3s"}}/>
          <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",
            ...M,fontSize:12,color:"#F7F4EF"}}>{ilusha}%</div>
        </div>
        <div style={{fontSize:20}}>{ilusha<35?"😬":ilusha<65?"😐":ilusha<85?"😊":"🥳"}</div>
      </div>
      <input type="range" min={0} max={100} value={ilusha}
        onChange={e=>setAndSave(+e.target.value)}
        style={{width:"100%",accentColor:barColor,marginBottom:8}}/>
      <div style={{...M,fontSize:12,color:"#C8B89A",textAlign:"center",minHeight:18}}>{label}</div>
    </div>
  );
}

// ── MAIN APP ──
function App(){
  const [cats,setCats]           = useState(null);
  const [roughData,setRoughData]   = useState({planned:ROUGH_PLANNED, paid:0}); // черновые работы
  const [tab,setTab]             = useState("overview");
  const [openCats,setOpenCats]   = useState({});
  const [openSubs,setOpenSubs]   = useState({});
  const [openRough,setOpenRough] = useState({});
  const [editAlt,setEditAlt]     = useState(null);
  const [dragSub,setDragSub]     = useState(null); // {catId,subId}
  const [dragAlt,setDragAlt]     = useState(null); // {catId,subId,altId}
  const [addingAlt,setAddingAlt] = useState(null); // subId where inline form is open
  const [newAlt,setNewAlt]       = useState({name:"",url:"",imageUrl:"",imageData:"",price:"",paid:"",comment:""});
  const [newCatModal,setNewCatModal]=useState(false);
  const [newCat,setNewCat]       = useState({name:"",icon:"📦",copyFromId:null});
  const [editCatId,setEditCatId] = useState(null); // inline edit
  const [filterRoom,setFilterRoom]   = useState("all");
  const [filterStatus,setFilterStatus]=useState("all");
  const [filterCat,setFilterCat]     = useState("all");
  const [filterView,setFilterView]   = useState("all");
  const [saveStatus,setSaveStatus]=useState(null);
  const [lastSync,setLastSync]   = useState(null);
  const [fbReady,setFbReady]     = useState(!!window._fb);
  const [exportModal,setExportModal]=useState(false);
  const [exportText,setExportText]  =useState("");
  const [deleteModal,setDeleteModal]=useState(null); // {msg, onConfirm}
  const saveTimer=useRef(null);
  const importRef=useRef();

  useEffect(()=>{
    if(window._fb){setFbReady(true);return;}
    const h=()=>setFbReady(true);
    window.addEventListener("firebase-ready",h);
    return()=>window.removeEventListener("firebase-ready",h);
  },[]);

  useEffect(()=>{
    if(!fbReady)return;
    const {db,ref,onValue}=window._fb;
    const unsub=onValue(ref(db,DB_KEY),snap=>{
      try {
        const val=snap.val();
        if(val&&val.cats){
          // Migrate: add missing fields to old data
          if(val.roughData) setRoughData(val.roughData);
          const migrated = val.cats.map(cat=>({
            ...cat,
            subs: (cat.subs||[]).map(sub=>({
              planned:0, selected:0, paid:0,
              status:"none", roomIds:[], url:"", imageUrl:"", imageData:"", comment:"", alts:[],
              ...sub,
              roomIds: sub.roomIds||[],
              alts: sub.alts||[],
            }))
          }));
          setCats(migrated);
        } else {
          setCats(DEFAULT_CATS);
        }
      } catch(e) {
        console.error("Load error:", e);
        setCats(DEFAULT_CATS);
      }
      setLastSync(new Date());
      setSaveStatus("saved");
      setTimeout(()=>setSaveStatus(null),2000);
    });
    return()=>unsub();
  },[fbReady]);

  useEffect(()=>{
    if(!cats||IS_VIEWER||!fbReady)return;
    clearTimeout(saveTimer.current);
    setSaveStatus("saving");
    saveTimer.current=setTimeout(async()=>{
      try{
        const {db,ref,set}=window._fb;
        await set(ref(db,DB_KEY),{cats, roughData});
        setSaveStatus("saved");
        setTimeout(()=>setSaveStatus(null),2000);
      }catch(e){setSaveStatus("error");}
    },800);
  },[cats,roughData,fbReady]);

  const handleExport=()=>{
    if(!cats)return;
    setExportText(JSON.stringify({cats,exportedAt:new Date().toISOString(),version:"ilusha-design-2026"},null,2));
    setExportModal(true);
  };

  const handleImport=e=>{
    const file=e.target.files[0];
    if(!file)return;
    const r=new FileReader();
    r.onload=async ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.cats)throw new Error("Неверный формат");
        if(!window.confirm("Загрузить данные? Текущие будут заменены."))return;
        const {db,ref,set}=window._fb;
        await set(ref(db,DB_KEY),{cats:data.cats});
        alert("✓ Загружено!");
      }catch(err){alert("Ошибка: "+err.message);}
    };
    r.readAsText(file);
    e.target.value="";
  };

  if(!cats) return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",
      fontFamily:"'DM Mono',monospace",fontSize:13,color:"#9A8A72",background:"#F7F4EF",gap:10}}>
      <span style={{fontSize:22}}>⏳</span>
      {fbReady?"Загружаю данные…":"Подключаюсь к Firebase…"}
    </div>
  );

  // ── DERIVED STATE ──
  // ── DERIVED (computed on every render, no useMemo) ──
  const proj = cats ? calcProject(cats, roughData) : calcProject([], roughData);

  const filteredCats = !cats ? [] : cats.map(cat=>{
    if(!cat||!cat.subs) return null;
    if(filterCat!=="all" && cat.id!==filterCat) return null;
    const filteredSubs = cat.subs.filter(sub=>{
      if(!sub) return false;
      const roomOk = filterRoom==="all" ||
        (sub.roomIds||[]).includes(filterRoom) ||
        (filterRoom==="common" && (sub.roomIds||[]).includes("common"));
      const statusOk = filterStatus==="all" || (sub.status||"none")===filterStatus;
      return roomOk && statusOk;
    });
    if(filteredSubs.length===0 && (filterRoom!=="all"||filterStatus!=="all")) return null;
    return {...cat, subs:filteredSubs};
  }).filter(Boolean);

  const isFiltered = filterRoom!=="all" || filterStatus!=="all" || filterCat!=="all" || filterView!=="all";

  const updSub=(cid,sid,patch)=>
    setCats(p=>p.map(c=>c.id!==cid?c:{...c,subs:c.subs.map(s=>s.id!==sid?s:{...s,...patch})}));

  const addAlt=(catId,subId)=>{
    if(!newAlt.name) return;
    const sub=cats.find(c=>c.id===catId).subs.find(s=>s.id===subId);
    const altId=uid();
    updSub(catId,subId,{alts:[...(sub.alts||[]),{id:altId,...newAlt}]});
    setNewAlt({name:"",url:"",imageUrl:"",imageData:"",price:"",comment:""});
  };
  const removeAlt=(cid,sid,aid)=>{
    const sub=cats.find(c=>c.id===cid).subs.find(s=>s.id===sid);
    updSub(cid,sid,{alts:sub.alts.filter(a=>a.id!==aid)});
  };

  const M={fontFamily:"'DM Mono',monospace"};
  const card={background:"white",borderRadius:8,padding:"14px 16px",marginBottom:12,boxShadow:"0 1px 5px rgba(44,36,22,.07)"};

  return(
  <div style={{fontFamily:"'Cormorant Garamond',Georgia,serif",background:"#F7F4EF",minHeight:"100vh",color:"#2C2416"}}>
  <style>{`
    *{box-sizing:border-box;}

    /* ── DESKTOP BASE (zoom effect via font-size) ── */
    html{font-size:17px;}
    body{font-size:1rem;}

    input[type=text],input[type=number],textarea,select{
      font-family:'DM Mono',monospace;font-size:14px;color:#2C2416;
      background:#FDFAF6;border:1px solid #DDD5C4;border-radius:3px;padding:6px 9px;
    }
    input:focus,textarea:focus,select:focus{outline:none;border-color:#C8A97E;background:white;}
    input[type=number]{width:100px;text-align:right;}

    .tab{background:none;border:none;padding:10px 16px;cursor:pointer;
      font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.09em;
      color:#9A8A72;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;}
    .tab.on{color:#F7F4EF;border-bottom-color:#C8A97E;}
    .tab:hover:not(.on){color:#C8B89A;}

    .exp-btn{background:none;border:none;cursor:pointer;font-family:'DM Mono',monospace;
      font-size:11px;color:#C8A97E;display:flex;align-items:center;gap:5px;padding:0;}
    .exp-btn:hover{opacity:.7;}

    /* Bold category and sub names */
    .cat-name{font-weight:700;font-size:20px;letter-spacing:-.01em;}
    .sub-name{font-weight:600;font-size:17px;}

    .sub-sep{border-bottom:1px solid #F5F0E8;padding:14px 0;}
    .sub-sep:last-child{border-bottom:none;}

    .ghost-btn{background:none;border:1px dashed #C8B89A;color:#9A8A72;padding:5px 12px;
      border-radius:4px;cursor:pointer;font-family:'DM Mono',monospace;font-size:11px;}
    .ghost-btn:hover{border-color:#C8A97E;color:#C8A97E;}

    .icon-btn{background:none;border:none;cursor:pointer;font-size:15px;padding:3px 5px;border-radius:3px;}
    .icon-btn:hover{background:#F0EAE0;}

    .overlay{position:fixed;inset:0;background:rgba(44,36,22,.5);z-index:100;
      display:flex;align-items:center;justify-content:center;padding:16px;}
    .modal{background:white;border-radius:10px;padding:22px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;}
    .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-family:'DM Mono',monospace;font-size:11px;}

    /* ── MOBILE ── */
    @media(max-width:640px){
      html{font-size:14px;}

      /* Header: 2 cols instead of 4 */
      .hdr-grid{grid-template-columns:1fr 1fr !important;}

      /* Alt card: stack vertically */
      .alt-card-row{flex-direction:column !important;}
      .alt-card-img{width:100% !important;height:160px !important;border-right:none !important;border-bottom:1px solid #EDE7DC !important;}
      .alt-card-content{padding:10px !important;}

      /* Alt fields: wrap */
      .alt-fields{flex-wrap:wrap !important;gap:6px !important;}
      .alt-fields label{flex:1 1 45% !important;min-width:0 !important;}

      /* Sub header: tighter */
      .sub-sep{padding:10px 0;}

      /* Thumbnail smaller on mobile */
      .sub-thumb{width:40px !important;height:40px !important;}

      /* Cat totals: 2 cols */
      .cat-totals{grid-template-columns:1fr 1fr !important;}

      /* Filter bar: wrap tightly */
      .filter-pills{gap:4px !important;}
      .filter-pills button{padding:3px 7px !important;font-size:10px !important;}

      /* Variant card fields row: wrap */
      .var-fields{flex-wrap:wrap !important;overflow-x:hidden !important;}

      /* Content area padding */
      .content-pad{padding:10px 10px 48px !important;}

      /* Modal full width */
      .modal{padding:16px;border-radius:8px;}

      /* Tabs scrollable */
      .tabs-row{overflow-x:auto;-webkit-overflow-scrolling:touch;}
      .tab{padding:8px 10px;font-size:10px;}
    }
  `}</style>

  {/* ── HEADER ── */}
  <div style={{background:"#2C2416",color:"#F7F4EF",padding:"22px 18px 0"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
      <div style={{...M,fontSize:9,letterSpacing:".18em",color:"#C8A97E"}}>БЮДЖЕТ РЕМОНТА</div>
      <div style={{...M,fontSize:9,color:"#5A4A32",marginLeft:8}}>v3.2</div>
      <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",justifyContent:"flex-end"}}>
        {saveStatus==="saving"&&<span style={{...M,fontSize:10,padding:"3px 10px",borderRadius:10,background:"#FDF5E4",color:"#8A6A12"}}>сохраняю…</span>}
        {saveStatus==="saved"&&<span style={{...M,fontSize:10,padding:"3px 10px",borderRadius:10,background:"#E6F5EA",color:"#2A6A2A"}}>✓ сохранено</span>}
        {saveStatus==="error"&&<span style={{...M,fontSize:10,padding:"3px 10px",borderRadius:10,background:"#FAE0D4",color:"#8A2A1A"}}>⚠ ошибка</span>}
        {IS_VIEWER
          ? <><span style={{...M,fontSize:10,padding:"3px 10px",borderRadius:10,background:"#E6F1F8",color:"#1A5A7A"}}>👁 просмотр</span>
              {lastSync&&<span style={{...M,fontSize:9,color:"#6A5A42"}}>{lastSync.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}</span>}
              <button onClick={()=>window.location.reload()} style={{background:"none",border:"1px solid #4A6A7A",color:"#8ABACA",padding:"5px 10px",borderRadius:4,cursor:"pointer",...M,fontSize:10}}>↻</button>
            </>
          : <><button onClick={handleExport} style={{background:"none",border:"1px solid #4A6A5A",color:"#8ACAAA",padding:"5px 10px",borderRadius:4,cursor:"pointer",...M,fontSize:10}}>↓ экспорт</button>
              <button onClick={()=>window.print()} style={{background:"none",border:"1px solid #6A5A7A",color:"#B8A8CA",padding:"5px 10px",borderRadius:4,cursor:"pointer",...M,fontSize:10}}>🖨 печать</button>
              <button onClick={()=>importRef.current.click()} style={{background:"none",border:"1px solid #4A5A6A",color:"#8AAACA",padding:"5px 10px",borderRadius:4,cursor:"pointer",...M,fontSize:10}}>↑ импорт</button>
              <input ref={importRef} type="file" accept=".json" style={{display:"none"}} onChange={handleImport}/>
            </>
        }
      </div>
    </div>
    <h1 style={{fontWeight:300,fontSize:22,marginBottom:16}}>Ilusha Design 2026</h1>

    {/* ── HEADER SUMMARY ── */}
    {(()=>{
      const ceiling = TOTAL_BUDGET + BASE_RESERVE;
      const inBase  = proj.used <= TOTAL_BUDGET;
      const inCeil  = proj.used <= ceiling;
      const usedPct = Math.min(100, Math.round(proj.used / ceiling * 100));

      return(<div>
        {/* 4 main cards */}
        <div className="hdr-grid" style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:10,marginBottom:12}}>

          {/* 1. Бюджет */}
          <div>
            <div style={{...M,fontSize:9,letterSpacing:".08em",color:"#8A7A62",marginBottom:4}}>БЮДЖЕТ</div>
            <div style={{fontSize:16,fontWeight:300,color:"#C8A97E"}}>{fmtK(TOTAL_BUDGET)}</div>
            <div style={{...M,fontSize:9,color:"#6A5A42",marginTop:2}}>
              потолок {fmtK(ceiling)}
            </div>
          </div>

          {/* 2. Использовано */}
          <div>
            <div style={{...M,fontSize:9,letterSpacing:".08em",color:"#8A7A62",marginBottom:4}}>ИСПОЛЬЗОВАНО</div>
            <div style={{fontSize:16,fontWeight:300,color:"#F7F4EF"}}>{fmtK(proj.used)}</div>
            <div style={{...M,fontSize:9,color:"#6A5A42",marginTop:2}}>
              план / подобрано / оплачено
            </div>
          </div>

          {/* 3. Доступно */}
          <div>
            <div style={{...M,fontSize:9,letterSpacing:".08em",color:"#8A7A62",marginBottom:4}}>ДОСТУПНО</div>
            <div style={{fontSize:16,fontWeight:300,
              color:!inCeil?"#F0A070":!inBase?"#F0C060":"#90D4A0"}}>
              {proj.available>=0?fmtK(proj.available):"−"+fmtK(-proj.available)}
            </div>
            <div style={{...M,fontSize:9,color:"#6A5A42",marginTop:2}}>
              {!inCeil
                ? "⛔ превышен потолок 4М"
                : !inBase
                  ? `⚠ из резерва: ${fmtK(proj.overBase)}`
                  : `в бюджете, резерв +${fmtK(TOTAL_BUDGET-proj.used)}`
              }
            </div>
          </div>

          {/* 4. К оплате */}
          <div>
            <div style={{...M,fontSize:9,letterSpacing:".08em",color:"#8A7A62",marginBottom:4}}>К ОПЛАТЕ</div>
            <div style={{fontSize:16,fontWeight:300,color:proj.toPay>0?"#F0C060":"#90D4A0"}}>
              {proj.toPay>0?fmtK(proj.toPay):"✓ всё"}
            </div>
            <div style={{...M,fontSize:9,color:"#6A5A42",marginTop:2}}>
              {proj.toPay>0?`оплачено ${fmtK(proj.totalPaid)}`:"\u00A0"}
            </div>
          </div>

        </div>

        {/* Progress bar: base budget | reserve zone */}
        <div style={{marginBottom:4}}>
          <div style={{height:6,background:"#3C3426",borderRadius:3,overflow:"hidden",position:"relative"}}>
            {/* Base budget zone */}
            <div style={{position:"absolute",left:0,top:0,height:"100%",
              width:`${TOTAL_BUDGET/ceiling*100}%`,
              borderRight:"1px solid #5A4A32"}}/>
            {/* Used fill */}
            <div style={{height:"100%",borderRadius:3,transition:"width .4s",
              width:`${usedPct}%`,
              background:!inCeil?"#E8937A":!inBase?"#E8C060":"#4A9A5A"}}/>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",...M,fontSize:9,color:"#6A5A42",marginTop:3}}>
            <span>0</span>
            <span style={{color:"#C8A97E"}}>3.5М</span>
            <span>4.0М</span>
          </div>
        </div>

        {/* Savings / overruns */}
        {(proj.savings>0||proj.overruns>0)&&(
          <div style={{display:"flex",gap:16,marginBottom:6,...M,fontSize:10}}>
            {proj.savings>0&&<span style={{color:"#90D4A0"}}>🟢 Экономия: {fmt(proj.savings)}</span>}
            {proj.overruns>0&&<span style={{color:"#F0A070"}}>🔴 Перерасход: {fmt(proj.overruns)}</span>}
          </div>
        )}
      </div>);
    })()}

    <div className="tabs-row" style={{display:"flex",borderTop:"1px solid #3C3426",marginTop:10,overflowX:"auto"}}>
      {[["overview","ОБЗОР"],["rough","ЧЕРНОВЫЕ"],["flexible","КАТЕГОРИИ"],["chart","ДИАГРАММА"]].map(([id,lbl])=>(
        <button key={id} className={`tab ${tab===id?"on":""}`} onClick={()=>setTab(id)}>{lbl}</button>
      ))}
    </div>
  </div>

  {/* ── CONTENT ── */}
  <div className="content-pad" style={{padding:"14px 14px 48px"}}>

  {/* OVERVIEW */}
  {tab==="overview"&&(
    <div>
      <div style={card}>
        <div style={{...M,fontSize:10,color:"#9A8A72",letterSpacing:".1em",marginBottom:12}}>СТРУКТУРА БЮДЖЕТА</div>
        {[
          {name:"Черновые работы", planned:roughData.planned||ROUGH_PLANNED, selected:0, paid:roughData.paid||0, color:"#C8A97E", note:"А4РЕМОНТ", fixed:true},
          ...cats.map(c=>{const cc=calcCat(c);return{name:c.icon+" "+c.name,planned:cc.planned,actualSum:cc.actualSum,paid:cc.paid,delta:cc.delta,color:c.color,catId:c.id,fixed:false};}),
          {name:"🗂 Запас на новые статьи", planned:200000, color:"#A8B8C8", note:"буфер для позиций которые добавятся", fixed:true, reserve:true},
        ].map((item,i)=>{
          const isOver = item.delta>0;
          const hasData = item.actualSum>0 && item.actualSum!==item.planned;
          return(
          <div key={i}
            onClick={()=>{
              if(item.catId){
                setTab("flexible");
                setOpenCats(p=>({...p,[item.catId]:true}));
                setTimeout(()=>{
                  const el=document.getElementById("cat-"+item.catId);
                  if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
                },100);
              }
            }}
            style={{padding:"10px 0",borderBottom:"1px solid #F5F0E8",
              cursor:item.catId?"pointer":"default",
              background:isOver?"#FEF8F8":"transparent",
              marginLeft:-16,marginRight:-16,paddingLeft:16,paddingRight:16,
              transition:"background .15s"}}
            onMouseEnter={e=>{if(item.catId)e.currentTarget.style.background=isOver?"#FAF0F0":"#F9F6F1";}}
            onMouseLeave={e=>{if(item.catId)e.currentTarget.style.background=isOver?"#FEF8F8":"transparent";}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:5}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:14,fontWeight:isOver?500:400}}>{item.name}</span>
                {item.fixed&&<span className="badge" style={{background:"#EDE7DC",color:"#7A6A52"}}>фикс</span>}
                {item.catId&&<span style={{...M,fontSize:9,color:"#C8B89A"}}>→</span>}
              </div>
              <div style={{textAlign:"right",display:"flex",flexDirection:"column",gap:2,alignItems:"flex-end"}}>
                <div style={{...M,fontSize:13}}>{fmt(item.planned)}</div>

                                    alts:(sub.alts||[]).map(a=>({...a,id:uid(),paid:""}))};
                                  setCats(p=>p.map(c=>c.id!==cat.id?c:{...c,
                                    subs:[...c.subs.slice(0,c.subs.findIndex(s=>s.id===sub.id)+1),
                                      copy,...c.subs.slice(c.subs.findIndex(s=>s.id===sub.id)+1)]}));
                                }}
                                style={{fontSize:11,opacity:.6}}>⧉</button>}
                            </div>
                          </div>
                          {/* Active alt URL + name — shown in collapsed view */}
                          {(()=>{
                            const activeAlt = sub.activeAltId&&(sub.alts||[]).find(a=>a.id===sub.activeAltId);
                            const linkUrl = (activeAlt&&activeAlt.url) || sub.url;
                            const altName = activeAlt?.name || null;
                            return(
                              <div style={{display:"flex",alignItems:"center",gap:6,marginTop:3,flexWrap:"wrap"}}>
                                {altName&&<span style={{...M,fontSize:10,padding:"1px 7px",borderRadius:8,
                                  background:"#E6F5EA",color:"#2A6A2A"}}>✓ {altName}</span>}
                                {linkUrl&&<a href={linkUrl} target="_blank" rel="noreferrer"
                                  style={{fontSize:10,...M,color:"#8DB5C8",
                                    overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:240}}>
                                  🔗 {(()=>{try{return new URL(linkUrl).hostname.replace("www.","")}catch(e){return linkUrl.slice(0,40)}})()}
                                </a>}
                              </div>
                            );
                          })()}
                          {sub.comment&&<div style={{fontSize:12,color:"#7A6A52",marginTop:3,fontStyle:"italic"}}>{sub.comment}</div>}
                          {/* Compact amounts when collapsed — from active alt or planned */}
                          {!isSubOpen&&(()=>{
                            const activeAlt = sub.activeAltId&&(sub.alts||[]).find(a=>a.id===sub.activeAltId);
                            const showPrice = activeAlt ? altPrice(activeAlt) : (sub.selected || 0);
                            const showPaid  = activeAlt ? (toNum(activeAlt.paid)||0) : (sub.paid||0);
                            return(sub.planned>0||showPrice>0)&&(
                              <div style={{display:"flex",gap:10,marginTop:4,...M,fontSize:11,color:"#7A6A52",flexWrap:"wrap"}}>
                                {sub.planned>0&&<span>план: {fmt(sub.planned)}</span>}
                                {showPrice>0&&<span style={{color:"#5A9AB8"}}>подобрано: {Number(showPrice).toLocaleString("ru-RU")} ₽</span>}
                                {showPaid>0&&<span style={{color:"#4A9A5A"}}>оплачено: {Number(showPaid).toLocaleString("ru-RU")} ₽</span>}
                              </div>
                            );
                          })()}
                          {/* Room tags (always visible) */}
                          {(sub.roomIds||[]).length>0&&(
                            <div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:5}}>
                              {(sub.roomIds||[]).map(rid=>{
                                const r=ROOM_MAP[rid];
                                return r?<span key={rid} style={{...M,fontSize:9,padding:"2px 7px",borderRadius:10,background:"#EDE7DC",color:"#5A4A32"}}>{r.icon} {r.label}</span>:null;
                              })}
                            </div>
                          )}
                        </div>
                      </div>

                      {/* Expanded sub — header only, variants are the main content */}
                      {isSubOpen&&(
                        <div style={{marginTop:10,marginLeft:80,borderLeft:"2px solid #EDE7DC",paddingLeft:12}}>

                          {/* ── SUB META (plan, comment, rooms, view status) ── */}
                          <div style={{background:"#FDFAF6",border:"1px solid #EDE7DC",borderRadius:6,
                            padding:"10px 14px",marginBottom:12}}>

                            {/* Plan amount */}
                            {!IS_VIEWER&&(
                              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                                <div style={{...M,fontSize:9,color:"#B8A878",flexShrink:0}}>ЗАПЛАНИРОВАНО</div>
                                <input type="number" placeholder="0" value={sub.planned||""}
                                  onChange={e=>updSub(cat.id,sub.id,{planned:Math.max(0,+e.target.value||0)})}
                                  style={{width:110}}/>
                                <div style={{...M,fontSize:9,color:"#9A8A72"}}>
                                  — суммы подобрано берутся из выбранного варианта
                                </div>
                              </div>
                            )}
                            {IS_VIEWER&&sub.planned>0&&(
                              <div style={{...M,fontSize:11,color:"#B8A878",marginBottom:6}}>план: {fmt(sub.planned)}</div>
                            )}



                            {/* Rooms */}
                            {!IS_VIEWER&&(
                              <div style={{marginBottom:8}}>
                                <RoomPicker roomIds={sub.roomIds||[]} onChange={ids=>updSub(cat.id,sub.id,{roomIds:ids})}/>
                              </div>
                            )}

                            {/* View status */}
                            <div>
                              <div style={{...M,fontSize:9,color:"#9A8A72",marginBottom:5}}>ПРОСМОТР</div>
                              <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                                {[{id:"none",label:"Нужно посмотреть"},{id:"skip",label:"Не нужно"},{id:"viewed",label:"✓ Посмотрели"}].map(vs=>{
                                  const active=(sub.viewStatus||"none")===vs.id;
                                  return IS_VIEWER
                                    ? active&&<span key={vs.id} style={{...M,fontSize:10,padding:"3px 10px",borderRadius:10,
                                        background:vs.id==="viewed"?"#E6F5EA":"#F5F0E8",
                                        color:vs.id==="viewed"?"#2A6A2A":"#7A6A52"}}>{vs.label}</span>
                                    : <button key={vs.id} onClick={()=>updSub(cat.id,sub.id,{viewStatus:vs.id})}
                                        style={{background:active?"#2C2416":"none",color:active?"#F7F4EF":"#7A6A52",
                                          border:"1px solid",borderColor:active?"#2C2416":"#DDD5C4",
                                          padding:"3px 10px",borderRadius:10,cursor:"pointer",...M,fontSize:10}}>
                                        {vs.label}
                                      </button>;
                                })}
                              </div>
                            </div>
                          </div>

                          {/* ── VARIANTS ── equal cards, active first with green border ── */}
                          <div>
                            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                              <span style={{...M,fontSize:10,color:"#9A8A72",letterSpacing:".06em"}}>
                                ВАРИАНТЫ {sub.alts&&sub.alts.length>0&&`(${sub.alts.length})`}
                              </span>
                              {!IS_VIEWER&&<button className="ghost-btn"
                                onClick={()=>{setAddingAlt(sub.id===addingAlt?null:sub.id);setNewAlt({name:"",url:"",imageUrl:"",imageData:"",price:"",paid:"",comment:""});}}>
                                + добавить вариант
                              </button>}
                            </div>

                            {(sub.alts&&sub.alts.length===0)&&!IS_VIEWER&&(
                              <div style={{...M,fontSize:11,color:"#9A8A72",padding:"12px 0",textAlign:"center",

                              const altSrc=alt.imageData||alt.imageUrl||null;
                              const isEditing=editAlt&&editAlt.altId===alt.id;
                              const updateAlt=patch=>updSub(cat.id,sub.id,{

                                <div key={alt.id}
                                  draggable={!IS_VIEWER}
                                  onDragStart={e=>{e.stopPropagation();setDragAlt({catId:cat.id,subId:sub.id,altId:alt.id});}}

                                  onDragLeave={e=>e.currentTarget.style.outline="none"}
                                  onDrop={e=>{
                                    e.currentTarget.style.outline="none";
                                    if(!dragAlt||dragAlt.altId===alt.id)return;
                                    e.preventDefault();
                                    // Move alt from source sub to this sub (before this alt)
                                    const srcCat=cats.find(c=>c.id===dragAlt.catId);
                                    if(!srcCat)return;
                                    const srcSub=srcCat.subs.find(s=>s.id===dragAlt.subId);
                                    if(!srcSub)return;
                                    const movedAlt=srcSub.alts.find(a=>a.id===dragAlt.altId);
                                    if(!movedAlt)return;
                                    setCats(p=>p.map(c=>{
                                      // Remove from source
                                      if(c.id===dragAlt.catId){
                                        return {...c,subs:c.subs.map(s=>s.id!==dragAlt.subId?s:{
                                          ...s,alts:s.alts.filter(a=>a.id!==dragAlt.altId),
                                          activeAltId:s.activeAltId===dragAlt.altId?null:s.activeAltId
                                        })};
                                      }
                                      return c;
                                    }));
                                    // Add to target sub (same or different)
                                    const targetSubId=sub.id;
                                    const targetCatId=cat.id;
                                    setCats(p=>p.map(c=>{
                                      if(c.id!==targetCatId)return c;
                                      return {...c,subs:c.subs.map(s=>{
                                        if(s.id!==targetSubId)return s;
                                        const idx=s.alts.findIndex(a=>a.id===alt.id);
                                        const newAlts=[...s.alts];
                                        newAlts.splice(idx,0,movedAlt);
                                        return {...s,alts:newAlts};
                                      })};
                                    }));
                                    setDragAlt(null);

                                    background:isActive?"#F0F8F2":"white",
                                    transition:"border-color .2s,background .2s",
                                    opacity:dragAlt&&dragAlt.altId===alt.id?.5:1
                                  }}>
                                  <div className="alt-card-row" style={{display:"flex",alignItems:"flex-start"}}>

                                    {/* Left: image block */}
                                    <div className="alt-card-img" style={{width:80,minHeight:80,flexShrink:0,
                                      background:"#F5F2EE",display:"flex",alignItems:"center",
                                      justifyContent:"center",cursor:alt.url?"pointer":"default",
                                      position:"relative",borderRight:"1px solid #EDE7DC"}}
                                      onClick={()=>alt.url&&window.open(alt.url,"_blank")}>
                                      {altSrc
                                        ? <img src={altSrc} alt="" style={{width:80,height:80,objectFit:"contain"}}
                                            onError={e=>e.target.style.display="none"}/>

                                      }
                                      {isActive&&<div style={{position:"absolute",top:5,left:5,
                                        width:10,height:10,borderRadius:"50%",background:"#4A9A5A",
                                        boxShadow:"0 0 0 2px white"}}/>}
                                    </div>

                                    {/* Right: content */}
                                    <div className="alt-card-content" style={{flex:1,minWidth:0,padding:"10px 12px"}}>

                                      {/* Row 1: name + buttons */}
                                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,marginBottom:6}}>
                                        {isEditing&&!IS_VIEWER
                                          ? <input type="text" value={alt.name||""} placeholder="Название модели"
                                              onChange={e=>updateAlt({name:e.target.value})}
                                              style={{fontSize:13,fontFamily:"'Cormorant Garamond',serif",
                                                border:"none",borderBottom:"1px solid #C8A97E",
                                                background:"transparent",flex:1,color:"#2C2416",padding:"0 0 2px"}}/>
                                          : <span style={{fontSize:14,lineHeight:1.3,flex:1}}>{alt.name||"Без названия"}</span>
                                        }
                                        <div style={{display:"flex",gap:4,flexShrink:0,alignItems:"center"}}>
                                          {!IS_VIEWER&&!isActive&&<button onClick={()=>updSub(cat.id,sub.id,{activeAltId:alt.id})}
                                            style={{...M,fontSize:10,padding:"3px 10px",borderRadius:6,
                                              background:"none",border:"1px solid #4A9A5A",color:"#4A9A5A",cursor:"pointer",whiteSpace:"nowrap"}}>
                                            ✓ выбрать</button>}
                                          {!IS_VIEWER&&isActive&&<button onClick={()=>updSub(cat.id,sub.id,{activeAltId:null})}
                                            style={{...M,fontSize:10,padding:"3px 10px",borderRadius:6,
                                              background:"#4A9A5A",border:"none",color:"white",cursor:"pointer",whiteSpace:"nowrap"}}>
                                            ✓ выбран</button>}
                                          {IS_VIEWER&&isActive&&<span style={{...M,fontSize:10,padding:"3px 9px",borderRadius:6,
                                            background:"#4A9A5A",color:"white"}}>✓ выбран</span>}
                                          {!IS_VIEWER&&<>
                                            <button className="icon-btn" style={{fontSize:12}}
                                              onClick={()=>setEditAlt(isEditing?null:{catId:cat.id,subId:sub.id,altId:alt.id})}
                                              title={isEditing?"сохранить":"редактировать"}>✏️</button>
                                            <button className="icon-btn" style={{fontSize:12,opacity:.6}} title="Дублировать"
                                              onClick={()=>{
                                                const copy={...alt,id:uid(),name:alt.name+" (копия)",paid:""};
                                                updSub(cat.id,sub.id,{alts:[...(sub.alts||[]),copy]});
                                              }}>⧉</button>
                                            <button className="icon-btn" style={{fontSize:12,color:"#C8A0A0"}}
                                              onClick={()=>setDeleteModal({msg:`Удалить вариант «${alt.name}»?`,onConfirm:()=>{
                                                removeAlt(cat.id,sub.id,alt.id);
                                                if(sub.activeAltId===alt.id) updSub(cat.id,sub.id,{activeAltId:null});
                                              }})}>✕</button>
                                          </>}
                                        </div>
                                      </div>

                                      {/* Row 2: всегда видно, в edit режиме — поля */}
                                      {(()=>{
                                        const ap=altPrice(alt);
                                        const up=toNum(alt.unitPrice);
                                        const qty=toNum(alt.qty)||1;
                                        return isEditing&&!IS_VIEWER ? (
                                          <div style={{display:"flex",gap:6,flexWrap:"nowrap",alignItems:"center",marginBottom:6,overflowX:"auto"}}>
                                            <label style={{display:"flex",alignItems:"center",gap:3,flexShrink:0}}>
                                              <span style={{...M,fontSize:9,color:"#5A9AB8",whiteSpace:"nowrap"}}>ЦЕНА/ЕД.</span>
                                              <input type="number" value={alt.unitPrice||"0"} placeholder="0"
                                                onChange={e=>{
                                                  const up=toNum(e.target.value);
                                                  const qty=toNum(alt.qty)||1;
                                                  updateAlt({unitPrice:e.target.value,price:up>0?String(up*qty):""});
                                                }} style={{width:100,textAlign:"left"}}/>
                                            </label>
                                            <label style={{display:"flex",alignItems:"center",gap:3,flexShrink:0}}>
                                              <span style={{...M,fontSize:9,color:"#5A9AB8",whiteSpace:"nowrap"}}>КОЛ-ВО</span>
                                              <input type="number" value={alt.qty||1} placeholder="1" min="0.1" step="0.1"
                                                onChange={e=>{
                                                  const qty=Math.max(0.1,toNum(e.target.value)||1);
                                                  const up=toNum(alt.unitPrice);
                                                  updateAlt({qty:String(qty),price:up>0?String(up*qty):""});
                                                }} style={{width:65,textAlign:"left"}}/>
                                            </label>
                                            <div style={{display:"flex",alignItems:"center",gap:3,flexShrink:0}}>
                                              <span style={{...M,fontSize:9,color:"#5A9AB8",whiteSpace:"nowrap"}}>ИТОГО</span>
                                              <div style={{...M,fontSize:11,color:"#5A9AB8",background:"#EDF4FA",
                                                border:"1px solid #C8D8E8",borderRadius:3,padding:"4px 8px",
                                                minWidth:90,textAlign:"right",whiteSpace:"nowrap"}}>
                                                {up>0?(up*qty).toLocaleString("ru-RU")+" ₽":"—"}
                                              </div>
                                            </div>
                                            <label style={{display:"flex",alignItems:"center",gap:3,flexShrink:0}}>
                                              <span style={{...M,fontSize:9,color:"#4A9A5A",whiteSpace:"nowrap"}}>ОПЛАЧЕНО</span>
                                              <input type="number" value={alt.paid||""} placeholder="0"
                                                onChange={e=>updateAlt({paid:e.target.value})} style={{width:90,textAlign:"left"}}/>
                                            </label>
                                            <label style={{display:"flex",alignItems:"center",gap:3,flex:1,minWidth:80}}>
                                              <span style={{...M,fontSize:9,color:"#9A8A72",whiteSpace:"nowrap"}}>ССЫЛКА</span>
                                              <input type="text" value={alt.url||""} placeholder="https://..."
                                                onChange={e=>updateAlt({url:e.target.value})} style={{flex:1,minWidth:60}}/>
                                            </label>
                                            <label style={{display:"flex",alignItems:"center",gap:3,flex:1,minWidth:80}}>
                                              <span style={{...M,fontSize:9,color:"#9A8A72",whiteSpace:"nowrap"}}>ФОТО</span>
                                              <input type="text" value={alt.imageUrl||""} placeholder="https://...jpg"
                                                onChange={e=>updateAlt({imageUrl:e.target.value,imageData:""})} style={{flex:1,minWidth:60}}/>
                                            </label>
                                          </div>
                                        ) : (
                                          <div style={{display:"flex",flexDirection:"column",gap:4,marginBottom:4}}>
                                            {/* Prices row */}
                                            <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
                                              {up>0&&<span style={{...M,fontSize:11,color:"#5A9AB8"}}>
                                                цена/ед.: {Number(up).toLocaleString("ru-RU")} ₽
                                              </span>}
                                              <span style={{...M,fontSize:11,color:"#5A9AB8"}}>
                                                кол-во: {qty}
                                              </span>
                                              <span style={{...M,fontSize:11,color:"#5A9AB8",fontWeight:up>0&&qty>1?500:400}}>
                                                {up>0
                                                  ? `итого: ${Number(ap).toLocaleString("ru-RU")} ₽`
                                                  : ap>0?`подобрано: ${Number(ap).toLocaleString("ru-RU")} ₽`:"подобрано: —"}
                                              </span>
                                              {alt.paid&&<span style={{...M,fontSize:11,color:"#4A9A5A"}}>
                                                оплачено: {Number(alt.paid).toLocaleString("ru-RU")} ₽
                                              </span>}
                                              {alt.url&&<a href={alt.url} target="_blank" rel="noreferrer"
                                                style={{...M,fontSize:10,color:"#8DB5C8",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:220}}>
                                                🔗 {(()=>{try{return new URL(alt.url).hostname.replace("www.","")}catch(e){return alt.url.slice(0,30)}})()}
                                              </a>}
                                            </div>
                                            {/* Comment — collapsible */}
                                          </div>
                                        );
                                      })()}

                                      {/* Row 3: комментарий — всегда виден */}
                                      {isEditing&&!IS_VIEWER
                                        ? <textarea value={alt.comment||""} placeholder="Комментарий..."
                                            onChange={e=>updateAlt({comment:e.target.value})}
                                            onInput={e=>{e.target.style.height="auto";e.target.style.height=e.target.scrollHeight+"px";}}
                                            style={{width:"100%",resize:"vertical",minHeight:32,marginTop:4}}/>
                                        : <AltComment comment={alt.comment||""} M={M}/>
                                      }
                                    </div>
                                  </div>
                                </div>
                              );
                            })}
                          </div>

                          {/* Inline add variant form */}
                          {addingAlt===sub.id&&!IS_VIEWER&&(
                            <div style={{background:"#F5F0E8",borderRadius:8,padding:"12px",marginTop:8,border:"1px solid #DDD5C4"}}>
                              <div style={{...M,fontSize:10,color:"#7A6A52",marginBottom:8}}>НОВЫЙ ВАРИАНТ</div>
                              {/* Row 1: название */}
                              <div style={{marginBottom:6}}>
                                <div style={{...M,fontSize:9,color:"#9A8A72",marginBottom:2}}>НАЗВАНИЕ *</div>
                                <input type="text" placeholder="Ferroni Гарда" value={newAlt.name}
                                  onChange={e=>setNewAlt(p=>({...p,name:e.target.value}))}
                                  style={{width:"100%",textAlign:"left"}}/>
                              </div>
                              {/* Row 2: все поля в одну строку */}
                              <div style={{display:"flex",gap:6,flexWrap:"nowrap",alignItems:"flex-end",marginBottom:6,overflowX:"auto"}}>
                                <div style={{flexShrink:0}}>
                                  <div style={{...M,fontSize:9,color:"#5A9AB8",marginBottom:2}}>ЦЕНА/ЕД.</div>
                                  <input type="number" placeholder="0" value={newAlt.unitPrice||"0"}
                                    onChange={e=>{
                                      const up=toNum(e.target.value);
                                      const qty=toNum(newAlt.qty)||1;
                                      setNewAlt(p=>({...p,unitPrice:e.target.value,price:up>0?String(up*qty):""}));
                                    }} style={{width:100,textAlign:"left"}}/>
                                </div>
                                <div style={{flexShrink:0}}>
                                  <div style={{...M,fontSize:9,color:"#5A9AB8",marginBottom:2}}>КОЛ-ВО</div>
                                  <input type="number" placeholder="1" value={newAlt.qty||1} min="0.1" step="0.1"
                                    onChange={e=>{
                                      const qty=Math.max(0.1,Math.round(toNum(e.target.value)*10)/10||1);
                                      const up=toNum(newAlt.unitPrice);
                                      setNewAlt(p=>({...p,qty:String(qty),price:up>0?String(up*qty):""}));
                                    }} style={{width:65,textAlign:"left"}}/>
                                </div>
                                <div style={{flexShrink:0}}>
                                  <div style={{...M,fontSize:9,color:"#5A9AB8",marginBottom:2}}>ИТОГО</div>
                                  <div style={{...M,fontSize:11,color:"#5A9AB8",background:"#EDF4FA",
                                    border:"1px solid #C8D8E8",borderRadius:3,padding:"4px 8px",
                                    minWidth:90,textAlign:"right",height:26,display:"flex",alignItems:"center",justifyContent:"flex-end"}}>
                                    {toNum(newAlt.unitPrice)>0
                                      ? (toNum(newAlt.unitPrice)*(toNum(newAlt.qty)||1)).toLocaleString("ru-RU")+" ₽"
                                      : "—"}
                                  </div>
                                </div>
                                <div style={{flexShrink:0}}>
                                  <div style={{...M,fontSize:9,color:"#4A9A5A",marginBottom:2}}>ОПЛАЧЕНО</div>
                                  <input type="number" placeholder="0" value={newAlt.paid||""}
                                    onChange={e=>setNewAlt(p=>({...p,paid:e.target.value}))}
                                    style={{width:90,textAlign:"left"}}/>
                                </div>
                                <div style={{flex:1,minWidth:80}}>
                                  <div style={{...M,fontSize:9,color:"#9A8A72",marginBottom:2}}>ССЫЛКА</div>
                                  <input type="text" placeholder="https://..." value={newAlt.url||""}
                                    onChange={e=>setNewAlt(p=>({...p,url:e.target.value}))}
                                    style={{width:"100%"}}/>
                                </div>
                                <div style={{flex:1,minWidth:80}}>
                                  <div style={{...M,fontSize:9,color:"#9A8A72",marginBottom:2}}>ФОТО URL</div>
                                  <input type="text" placeholder="https://...jpg" value={newAlt.imageUrl||""}
                                    onChange={e=>setNewAlt(p=>({...p,imageUrl:e.target.value,imageData:""}))}
                                    style={{width:"100%"}}/>
                                </div>
                              </div>
                              {/* Row 3: комментарий */}
                              <div style={{marginBottom:8}}>
                                <div style={{...M,fontSize:9,color:"#9A8A72",marginBottom:2}}>КОММЕНТАРИЙ</div>
                                <textarea placeholder="Детали, цвет, размер..." value={newAlt.comment||""}
                                  onChange={e=>setNewAlt(p=>({...p,comment:e.target.value}))}
                                  style={{width:"100%",resize:"vertical",minHeight:30,textAlign:"left"}}/>
                              </div>
                              <button onClick={()=>addAlt(cat.id,sub.id)}
                                disabled={!newAlt.name}
                                style={{width:"100%",background:newAlt.name?"#2C2416":"#9A8A72",
                                  color:"#F7F4EF",border:"none",padding:"8px",borderRadius:5,
                                  cursor:newAlt.name?"pointer":"default",...M,fontSize:11}}>
                                ДОБАВИТЬ ВАРИАНТ
                              </button>
                            </div>
                          )}

                        </div>
                      )}
                    </div>
                  );
                })}

                {/* + subcat button */}
                {!IS_VIEWER&&<button className="ghost-btn"
                  onClick={()=>setCats(p=>p.map(c=>c.id!==cat.id?c:{...c,subs:[...c.subs,mk("Новая подкатегория",0)]}))}
                  style={{marginTop:10,width:"100%",textAlign:"center"}}>+ подкатегория</button>}
              </div>
            )}
          </div>
        );
      })}

      {/* + category button */}
      {!IS_VIEWER&&<button className="ghost-btn" onClick={()=>setNewCatModal(true)}
        style={{width:"100%",textAlign:"center",padding:"10px",marginBottom:8,fontSize:12}}>
        + добавить категорию
      </button>}
    </div>
  )}

  {/* CHART */}
  {tab==="chart"&&(
    <div>
      <div style={card}>
        <div style={{...M,fontSize:10,color:"#9A8A72",letterSpacing:".1em",marginBottom:14}}>ЗАПЛАНИРОВАНО ПО КАТЕГОРИЯМ</div>
        {[
          {name:"Черновые работы", planned:ROUGH_PLANNED, selected:0, color:"#C8A97E"},
          ...cats.map(c=>{const cc=calcCat(c);return{name:c.icon+" "+c.name,planned:cc.planned,actualSum:cc.actualSum,paid:cc.paid,color:c.color};}),
        ].sort((a,b)=>b.planned-a.planned).map((item,i)=>(
          <div key={i} style={{marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:4,flexWrap:"wrap",gap:4}}>
              <span style={{fontSize:13}}>{item.name}</span>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <span style={{...M,fontSize:11,color:"#9A8A72"}}>план {fmt(item.planned)}</span>
                {item.actualSum!==item.planned&&<span style={{...M,fontSize:11,color:"#5A9AB8"}}>фактически {fmt(item.actualSum)}</span>}
              </div>
            </div>
            <div style={{height:16,background:"#EDE7DC",borderRadius:4,overflow:"hidden",position:"relative"}}>
              <div style={{position:"absolute",height:"100%",width:`${pct(item.planned,ROUGH_PLANNED)}%`,background:item.color,borderRadius:4,opacity:.5}}/>
              {item.actualSum!==item.planned&&<div style={{position:"absolute",height:"100%",width:`${pct(Math.min(item.actualSum,item.planned),ROUGH_PLANNED)}%`,background:item.color,borderRadius:4}}/>}
              {item.paid>0&&<div style={{position:"absolute",height:"100%",width:`${pct(item.paid,ROUGH_PLANNED)}%`,background:"#4A9A5A",borderRadius:4}}/>}
            </div>
          </div>
        ))}
      </div>

      <div style={card}>
        <div style={{...M,fontSize:10,color:"#9A8A72",letterSpacing:".1em",marginBottom:12}}>СТАТУСЫ ПО ПОЗИЦИЯМ</div>
        {STATUSES.map(st=>{
          const count=cats.flatMap(c=>c.subs).filter(s=>(s.status||"none")===st.id).length;
          if(!count)return null;
          const total=cats.flatMap(c=>c.subs).length;
          return(
            <div key={st.id} style={{marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                <span style={{...M,fontSize:11,padding:"2px 8px",borderRadius:8,background:st.bg,color:st.color}}>{st.label}</span>
                <span style={{...M,fontSize:12}}>{count} поз. ({Math.round(count/total*100)}%)</span>
              </div>
              <div style={{height:5,background:"#EDE7DC",borderRadius:3,overflow:"hidden"}}>
                <div style={{width:`${Math.round(count/total*100)}%`,height:"100%",background:st.color,borderRadius:3}}/>
              </div>
            </div>
          );
        })}
      </div>

      <div style={card}>
        <div style={{...M,fontSize:10,color:"#9A8A72",letterSpacing:".1em",marginBottom:12}}>СТАТУСЫ ПРОСМОТРА</div>
        {(()=>{
          const allSubs=cats.flatMap(c=>c.subs);
          const total=allSubs.length;
          return [
            {id:"none",  label:"👁 Нужно посмотреть", color:"#5A9AB8", bg:"#E6F1F8"},
            {id:"skip",  label:"— Не нужно",           color:"#9A8A72", bg:"#F0EAE0"},
            {id:"viewed",label:"✓ Посмотрели",          color:"#4A9A5A", bg:"#E6F5EA"},
          ].map(vs=>{
            const count=allSubs.filter(s=>(s.viewStatus||"none")===vs.id).length;
            return(
              <div key={vs.id} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                  <span style={{...M,fontSize:11,padding:"2px 8px",borderRadius:8,background:vs.bg,color:vs.color}}>{vs.label}</span>
                  <span style={{...M,fontSize:12}}>{count} поз. ({Math.round(count/total*100)}%)</span>
                </div>
                <div style={{height:5,background:"#EDE7DC",borderRadius:3,overflow:"hidden"}}>
                  <div style={{width:`${Math.round(count/total*100)}%`,height:"100%",background:vs.color,borderRadius:3}}/>
                </div>
              </div>
            );
          });
        })()}
      </div>
    </div>
  )}

  </div>

  {/* NEW CATEGORY MODAL */}
  {newCatModal&&(
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)setNewCatModal(false)}}>
      <div className="modal">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div style={{fontSize:18,fontWeight:300}}>Новая категория</div>
          <button className="icon-btn" style={{fontSize:18}} onClick={()=>setNewCatModal(false)}>✕</button>
        </div>

        {/* Icon picker */}
        <div style={{marginBottom:12}}>
          <div style={{...M,fontSize:9,color:"#9A8A72",marginBottom:6}}>ИКОНКА</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {["🪣","🛋️","🍳","📺","💡","🪞","🚪","🛏️","🚿","🏠","📦","🪑","🖼️","🧹","🔧","🪟","🏗️","🎨","🪴","🛁","🧺","🔑","📐","🪤","🎭","💎","🌿","🛗","🚰","🏮"].map(em=>(
              <button key={em} onClick={()=>setNewCat(p=>({...p,icon:em}))}
                style={{fontSize:18,padding:"4px 6px",borderRadius:6,cursor:"pointer",border:"none",
                  background:newCat.icon===em?"#2C2416":"#F5F0E8",
                  outline:newCat.icon===em?"2px solid #C8A97E":"none"}}>
                {em}
              </button>
            ))}
          </div>
        </div>

        {/* Name */}
        <div style={{marginBottom:12}}>
          <div style={{...M,fontSize:9,color:"#9A8A72",marginBottom:4}}>НАЗВАНИЕ *</div>
          <input type="text" placeholder="Мебель для спальни" value={newCat.name}
            onChange={e=>setNewCat(p=>({...p,name:e.target.value}))} style={{width:"100%"}}/>
        </div>

        {/* Copy from template */}
        <div style={{marginBottom:16}}>
          <div style={{...M,fontSize:9,color:"#9A8A72",marginBottom:4}}>СКОПИРОВАТЬ ПОДКАТЕГОРИИ ИЗ</div>
          <select value={newCat.copyFromId||""}
            onChange={e=>setNewCat(p=>({...p,copyFromId:e.target.value||null}))}
            style={{width:"100%",...M,fontSize:11,padding:"5px 8px",borderRadius:4,
              border:"1px solid #DDD5C4",background:"#FDFAF6",cursor:"pointer"}}>
            <option value="">— начать с чистого листа</option>
            {cats.map(c=><option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}
          </select>
          {newCat.copyFromId&&<div style={{...M,fontSize:10,color:"#9A8A72",marginTop:4}}>
            Подкатегории будут скопированы как шаблон (суммы обнулены)
          </div>}
        </div>

        <button onClick={()=>{
          if(!newCat.name)return;
          let subs;
          if(newCat.copyFromId){
            const src=cats.find(c=>c.id===newCat.copyFromId);
            subs=src?(src.subs||[]).map(s=>({...mk(s.name,0),name:s.name,roomIds:s.roomIds||[]})):[mk("Новая подкатегория",0)];
          } else {
            subs=[mk("Новая подкатегория",0)];
          }
          setCats(p=>[...p,{id:uid(),name:newCat.name,icon:newCat.icon||"📦",color:"#B8C8A8",subs}]);
          setNewCat({name:"",icon:"📦",copyFromId:null});
          setNewCatModal(false);
        }} style={{width:"100%",background:"#2C2416",color:"#F7F4EF",border:"none",padding:"10px",
          borderRadius:5,cursor:"pointer",...M,fontSize:11}}>
          СОЗДАТЬ
        </button>
      </div>
    </div>
  )}

  {/* EXPORT MODAL */}
  {exportModal&&(
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)setExportModal(false)}}>
      <div className="modal" style={{maxWidth:520}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div style={{fontSize:16,fontWeight:300}}>Экспорт данных</div>
          <button className="icon-btn" style={{fontSize:18}} onClick={()=>setExportModal(false)}>✕</button>
        </div>
        <div style={{...M,fontSize:10,color:"#7A6A52",marginBottom:10,lineHeight:1.6}}>
          Скопируй текст → сохрани как .json или скинь мне в чат
        </div>
        <textarea readOnly value={exportText} onClick={e=>e.target.select()}
          style={{width:"100%",height:160,...M,fontSize:9,background:"#F5F0E8",border:"1px solid #DDD5C4",borderRadius:4,padding:8,resize:"vertical"}}/>
        <button onClick={()=>navigator.clipboard&&navigator.clipboard.writeText(exportText).then(()=>alert("Скопировано!")).catch(()=>alert("Выдели текст и нажми Ctrl+C"))}
          style={{width:"100%",marginTop:10,background:"#2C2416",color:"#F7F4EF",border:"none",padding:"10px",borderRadius:5,cursor:"pointer",...M,fontSize:11}}>
          📋 скопировать
        </button>
      </div>
    </div>
  )}


  {/* DELETE CONFIRMATION MODAL */}
  {deleteModal&&(
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)setDeleteModal(null)}}>
      <div className="modal" style={{maxWidth:340,textAlign:"center"}}>
        <div style={{fontSize:32,marginBottom:12}}>🗑️</div>
        <div style={{fontSize:17,fontWeight:300,marginBottom:8,color:"#2C2416"}}>{deleteModal.msg}</div>
        <div style={{...M,fontSize:11,color:"#9A8A72",marginBottom:20}}>Это действие нельзя отменить</div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>setDeleteModal(null)}
            style={{flex:1,background:"none",border:"1px solid #DDD5C4",padding:"10px",
              borderRadius:6,cursor:"pointer",...M,fontSize:11,color:"#7A6A52"}}>
            Отмена
          </button>
          <button onClick={()=>{deleteModal.onConfirm();setDeleteModal(null);}}
            style={{flex:1,background:"#8A2A1A",border:"none",color:"white",padding:"10px",
              borderRadius:6,cursor:"pointer",...M,fontSize:11}}>
            Да, удалить
          </button>
        </div>
      </div>
    </div>
  )}

</div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
