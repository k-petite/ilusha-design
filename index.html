<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#F7F4EF;color:#2C2416;font-family:'Cormorant Garamond',Georgia,serif}button,input,select,textarea{font-family:'DM Mono',monospace}button{cursor:pointer}.mono{font-family:'DM Mono',monospace}.header{background:#2C2416;color:#F7F4EF;padding:24px 18px 0}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.kicker{font:10px 'DM Mono';letter-spacing:.18em;color:#C8A97E}.title{font-weight:300;font-size:26px;margin:8px 0 18px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 14px}.stat{min-height:70px}.stat .l{font:9px 'DM Mono';letter-spacing:.1em;color:#8A7A62;margin-bottom:5px}.stat .v{font-size:19px;font-weight:300}.stat .s{font:9px 'DM Mono';color:#8A7A62;margin-top:3px}.tabs{display:flex;border-top:1px solid #3C3426;overflow-x:auto}.tab{background:none;border:0;color:#9A8A72;padding:10px 14px;font:10px 'DM Mono';letter-spacing:.1em;border-bottom:2px solid transparent}.tab.on{color:#F7F4EF;border-bottom-color:#C8A97E}.wrap{padding:14px;max-width:1100px;margin:0 auto}.card{background:white;border-radius:10px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 5px rgba(44,36,22,.07)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pill{display:inline-block;border-radius:14px;padding:3px 9px;font:10px 'DM Mono';border:1px solid #DDD5C4;background:#FDFAF6;color:#7A6A52;margin:2px}.pill.on{background:#2C2416;color:#F7F4EF;border-color:#2C2416}.btn{border:1px solid #DDD5C4;background:#FDFAF6;border-radius:6px;padding:6px 10px;color:#5A4A32;font:10px 'DM Mono'}.btn.dark{background:#2C2416;color:#F7F4EF;border-color:#2C2416}.btn.dash{border-style:dashed}.catHead{border:0;background:transparent;color:#2C2416;font-size:17px;text-align:left}.mini{font:10px 'DM Mono';color:#9A8A72}.amountBox{border-radius:7px;padding:7px 9px;background:#F5F0E8}.amountBox .l{font:9px 'DM Mono';color:#7A6A52}.amountBox .v{font:12px 'DM Mono';margin-top:2px}.sub{border-top:1px solid #F0EAE0;padding:12px 0}.sub:first-child{margin-top:10px}.subTitle{font-size:16px}.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}.field label{display:block;font:9px 'DM Mono';color:#9A8A72;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;font-size:11px;padding:7px;border:1px solid #DDD5C4;border-radius:5px;background:#FDFAF6}.field textarea{min-height:58px}.delta{font:10px 'DM Mono';border-radius:12px;padding:2px 8px}.green{background:#D4F0D4;color:#1A6A1A}.red{background:#FAE0D4;color:#8A2A1A}.blue{background:#E6F1F8;color:#3A708A}.status{font:10px 'DM Mono';border-radius:12px;padding:3px 8px}.bar{height:7px;background:#EDE7DC;border-radius:6px;overflow:hidden;margin-top:8px}.fill{height:100%;background:#C8A97E}.modal{position:fixed;inset:0;background:rgba(44,36,22,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modalBox{background:white;border-radius:10px;padding:20px;max-width:540px;width:100%;max-height:90vh;overflow:auto}.hidden{display:none!important}.danger{color:#B06050}.ok{color:#4A9A5A}.warn{color:#C8A97E}@media(max-width:760px){.cards,.grid4,.inputs{grid-template-columns:1fr 1fr}.top{display:block}.header{padding-top:18px}}@media(max-width:460px){.cards,.grid4,.inputs{grid-template-columns:1fr}.wrap{padding:10px}}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
try{
 const firebaseConfig={apiKey:"AIzaSyBJqYB-ymSu5dw8kmB8iDGTzTDDArAeg_U",authDomain:"ilusha-design.firebaseapp.com",databaseURL:"https://ilusha-design-default-rtdb.europe-west1.firebasedatabase.app",projectId:"ilusha-design",storageBucket:"ilusha-design.firebasestorage.app",messagingSenderId:"668121580005",appId:"1:668121580005:web:0d702c91ed059164f4af0c"};
 const app=initializeApp(firebaseConfig); window._fb={db:getDatabase(app),ref,set,onValue}; window.dispatchEvent(new Event('firebase-ready'));

<body>
<div id="app"><div style="height:100vh;display:flex;align-items:center;justify-content:center;font:13px 'DM Mono';color:#9A8A72">Загружаю данные…</div></div>
<script>
(function(){
const DB_KEY='ilusha-design-2026'; const ROUGH=1407526; const BASE_RESERVE=500000; const IS_VIEWER=location.search.includes('view')||location.hash.includes('view');
const statuses=[['none','Не искал','#9A8A72','#F5F0E8'],['looking','Ищу','#5A9AB8','#E6F1F8'],['selected','Выбрано','#C8A97E','#FDF5E4'],['paid','Куплено','#4A9A5A','#E6F5EA'],['delivered','Доставлено','#7A6AB8','#EEE8F8'],['installed','Смонтировано','#2A6A2A','#D4F0D4']].map(([id,label,color,bg])=>({id,label,color,bg}));
const rooms=[['common','Вся квартира','🏠'],['entry','Прихожая','🚪'],['living','Гостиная','🛋️'],['bedroom','Спальня','🛏️'],['kitchen','Кухня','🍳'],['bathroom','Санузел','🚿'],['wardrobe','Гардеробная','👗'],['balcony','Балкон','🌿']].map(([id,label,icon])=>({id,label,icon}));
const smap=Object.fromEntries(statuses.map(s=>[s.id,s])); const rmap=Object.fromEntries(rooms.map(r=>[r.id,r]));
const uid=()=>Math.random().toString(36).slice(2,10); const mk=(name,planned=0)=>({id:uid(),name,planned,selected:0,paid:0,status:'none',roomIds:[],url:'',imageUrl:'',comment:'',alts:[]});
const defaultCats=[
{id:'finish',name:'Чистовая отделка',icon:'🪣',color:'#8DB5C8',subs:[mk('Инженерная доска / паркет',254900),mk('Керамогранит',127600),mk('Краска (стены + потолок)',59100),mk('Декоративная штукатурка',9400),mk('Плинтусы',13700),mk('Затирка и лак',3000),mk('Доставка материалов',20300)]},
{id:'furniture',name:'Мебель',icon:'🛋️',color:'#B8A3C8',subs:[mk('Диван',100000),mk('Матрас',65000),mk('Тумба под TV',14400),mk('Барная стойка (на заказ)',60900),mk('Стулья барные (×2)',0),mk('Журнальный столик',29100),mk('Полка для обуви + вешалка',7300),mk('Сборка и доставка',14200)]},
{id:'kitchen',name:'Кухня на заказ',icon:'🍳',color:'#A3C8B8',subs:[mk('Корпусная кухня (на заказ)',316800),mk('Столешница искусственный камень',134500),mk('Смеситель кухонный',11300),mk('Диспенсер + арматура мойки',9300),mk('Монтаж и доставка кухни',28100)]},
{id:'appliances',name:'Бытовая техника',icon:'📺',color:'#C8C0A3',subs:[mk('Телевизор 70\"',39400),mk('Холодильник встраиваемый',35100),mk('Стиральная машина',30500),mk('Духовой шкаф',44100),mk('Варочная панель',8000),mk('Чайник + тостер',21200),mk('Умные колонки (×2)',24600),mk('Пылесос + отпариватель',3300),mk('Роутер Wi-Fi',2700)]},
{id:'lighting',name:'Свет и электрика',icon:'💡',color:'#D4C87E',subs:[mk('Светильники потолочные (с/у, кухня, коридор)',53500),mk('Светильники встраиваемые (гостиная)',30800),mk('Светодиодная лента RGB',32900),mk('Розетки и выключатели Donel R98',25300),mk('Торшер напольный',0),mk('Лампы настольные',30500),mk('Доставка',900)]},
{id:'decor',name:'Декор, текстиль, С/У',icon:'🪞',color:'#C8A97E',subs:[mk('Ванна',16000),mk('Унитаз + инсталляция',13900),mk('Раковина + столешница С/У',9100),mk('Смесители С/У',6300),mk('Полотенцесушитель + аксессуары С/У',3700),mk('Климат-контроль',18300),mk('Двери + фурнитура',10500),mk('Корпусная мебель С/У',16600),mk('Зеркала',9400),mk('Шторы и тюль',700),mk('Постельное бельё + подушки',11800),mk('Картины, вазы, декор',4700),mk('Кухня: сантехника + аксессуары',18000)]}
];
const roughGroups=[['Демонтаж',118500+18900+9900+3000+3680+4350],['Стены',89250+19000+12000+47250+47350+45150+73500+51920],['Полы',46200+16500+18000+27880+17700],['Потолки',100000],['Электрика',37500+28880+38630+24450+26250],['Сантехника',19700+5500+30800+16200+38710+9140+38160],['Плитка',65000+52000+6900+24060],['Окна и двери',26600],['Прочее',30300]];
let state={cats:null,tab:'overview',openCats:{},openSubs:{},filterRoom:'all',filterStatus:'all',filterCat:'all',saveStatus:'',syncTime:null,fbReady:false}; let saveTimer=null;
function n(v){return Number(v)||0} function fmt(v){return n(v)===0?'—':new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(n(v)))+' ₽'} function fmtK(v){v=n(v); if(v<=0)return '—'; return v>=1e6?(v/1e6).toFixed(1)+'М ₽':Math.round(v/1000)+'К ₽'} function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function normalizeSub(x={}){return {id:x.id||uid(),name:x.name||x.title||x.n||'Новая подкатегория',planned:n(x.planned??x.plan??x.budget??x.amount??x.a),selected:n(x.selected??x.actual??x.real??x.chosen),paid:n(x.paid??x.payed??x.payment),status:smap[x.status]?x.status:'none',roomIds:Array.isArray(x.roomIds)?x.roomIds:(x.roomId?[x.roomId]:[]),url:x.url||x.link||'',imageUrl:x.imageUrl||x.image||'',comment:x.comment||x.note||'',alts:Array.isArray(x.alts)?x.alts:[]}}
function normalizeCats(arr){return (Array.isArray(arr)&&arr.length?arr:defaultCats).map((c,i)=>({id:c.id||uid(),name:c.name||c.title||`Категория ${i+1}`,icon:c.icon||'📦',color:c.color||'#B8C8A8',subs:(Array.isArray(c.subs)?c.subs:Array.isArray(c.items)?c.items:[]).map(normalizeSub)}))}
function actual(s){return n(s.paid)>0?n(s.paid):n(s.selected)>0?n(s.selected):n(s.planned)} function calcCat(c){let planned=0,selected=0,paid=0,actualSum=0; c.subs.forEach(s=>{planned+=n(s.planned);selected+=n(s.selected);paid+=n(s.paid);actualSum+=actual(s)}); return {planned,selected,paid,actualSum,delta:actualSum-planned}} function calcProject(){let planned=0,selected=0,paid=0,actualSum=0,savings=0,overruns=0; state.cats.flatMap(c=>c.subs).forEach(s=>{planned+=n(s.planned);selected+=n(s.selected);paid+=n(s.paid);actualSum+=actual(s);savings+=Math.max(0,n(s.planned)-actual(s));overruns+=Math.max(0,actual(s)-n(s.planned))}); return {planned,selected,paid,actualSum,savings,overruns,reserve:BASE_RESERVE+savings-overruns}}
function save(){ if(IS_VIEWER||!state.cats)return; clearTimeout(saveTimer); state.saveStatus='saving'; drawHeaderOnly(); saveTimer=setTimeout(()=>{const data={cats:normalizeCats(state.cats),updatedAt:new Date().toISOString()}; try{localStorage.setItem(DB_KEY,JSON.stringify(data))}catch(e){} if(window._fb){window._fb.set(window._fb.ref(window._fb.db,DB_KEY),data).then(()=>{state.saveStatus='saved';draw()}).catch(()=>{state.saveStatus='local';draw()})} else {state.saveStatus='local';draw()}},500)}
function load(){ if(location.search.includes('reset')){state.cats=normalizeCats(defaultCats); try{localStorage.removeItem(DB_KEY)}catch(e){}; draw(); save(); return} const local=()=>{try{let x=JSON.parse(localStorage.getItem(DB_KEY)||'{}'); state.cats=normalizeCats(x.cats)}catch(e){state.cats=normalizeCats(defaultCats)}; draw()}; if(window._fb){try{window._fb.onValue(window._fb.ref(window._fb.db,DB_KEY),snap=>{let v=snap.val(); state.cats=normalizeCats(v&&v.cats?v.cats:defaultCats); state.syncTime=new Date(); state.saveStatus='saved'; draw()},e=>{console.warn(e); local()})}catch(e){local()}} else local()}
function updateSub(cid,sid,patch){state.cats=state.cats.map(c=>c.id!==cid?c:{...c,subs:c.subs.map(s=>s.id!==sid?s:{...s,...patch})}); draw(); save()} function addSub(cid){state.cats=state.cats.map(c=>c.id!==cid?c:{...c,subs:[...c.subs,mk('Новая подкатегория',0)]}); draw(); save()} function delSub(cid,sid){if(!confirm('Удалить позицию?'))return; state.cats=state.cats.map(c=>c.id!==cid?c:{...c,subs:c.subs.filter(s=>s.id!==sid)}); draw(); save()} function addCat(){const name=prompt('Название категории'); if(!name)return; state.cats.push({id:uid(),name,icon:'📦',color:'#B8C8A8',subs:[mk('Новая подкатегория',0)]}); draw(); save()}
function deltaBadge(s){if(!s.selected&&!s.paid)return ''; let d=actual(s)-n(s.planned); if(!d)return ''; return `<span class="delta ${d>0?'red':'green'}">${d>0?'🔴 +':'🟢 '}${fmt(Math.abs(d))}</span>`}
function filteredCats(){return state.cats.map(c=>{if(state.filterCat!=='all'&&c.id!==state.filterCat)return null; let subs=c.subs.filter(s=>{let roomOk=state.filterRoom==='all'||(s.roomIds||[]).includes(state.filterRoom); let stOk=state.filterStatus==='all'||(s.status||'none')===state.filterStatus; return roomOk&&stOk}); if(!subs.length&&(state.filterRoom!=='all'||state.filterStatus!=='all'||state.filterCat!=='all'))return null; return {...c,subs}}).filter(Boolean)}
function header(){const p=calcProject();return `<div class="header"><div class="top"><div><div class="kicker">БЮДЖЕТ РЕМОНТА</div><h1 class="title">Ilusha Design 2026</h1></div><div>${state.saveStatus==='saving'?'<span class="status" style="background:#FDF5E4;color:#8A6A12">сохраняю…</span>':''}${state.saveStatus==='saved'?'<span class="status" style="background:#E6F5EA;color:#2A6A2A">✓ сохранено</span>':''}${state.saveStatus==='local'?'<span class="status" style="background:#E6F1F8;color:#1A5A7A">локально</span>':''}${IS_VIEWER?'<span class="status blue">👁 просмотр</span>':'<button class="btn" data-act="export">↓ экспорт</button> <button class="btn" data-act="import">↑ импорт</button><input id="importFile" type="file" accept=".json" class="hidden" />'}</div></div><div class="cards"><div class="stat"><div class="l">ЗАПЛАНИРОВАНО</div><div class="v">${fmtK(p.planned)}</div><div class="s">черновые +${fmtK(ROUGH)}</div></div><div class="stat"><div class="l">ФАКТИЧЕСКИ</div><div class="v">${fmtK(p.actualSum)}</div><div class="s">подобрано/оплачено/план</div></div><div class="stat"><div class="l">ОПЛАЧЕНО</div><div class="v">${fmtK(p.paid)}</div><div class="s">из ${fmtK(p.actualSum)}</div></div><div class="stat"><div class="l">РЕЗЕРВ 🛡</div><div class="v" style="color:${p.reserve<0?'#F0A070':p.reserve>BASE_RESERVE?'#90D4A0':'#F7F4EF'}">${fmtK(p.reserve)}</div><div class="s">${p.reserve>BASE_RESERVE?'+'+fmtK(p.reserve-BASE_RESERVE)+' экономия':p.reserve<BASE_RESERVE?'−'+fmtK(BASE_RESERVE-p.reserve)+' перерасход':'базовый'}</div></div></div><div class="tabs">${[['overview','ОБЗОР'],['rough','ЧЕРНОВЫЕ'],['flexible','КАТЕГОРИИ'],['chart','ДИАГРАММА']].map(([id,l])=>`<button class="tab ${state.tab===id?'on':''}" data-tab="${id}">${l}</button>`).join('')}</div></div>`}
function overview(){const p=calcProject();return `<div class="wrap"><div class="card"><div class="mini" style="margin-bottom:12px">СТРУКТУРА БЮДЖЕТА</div>${[{name:'Черновые работы',planned:ROUGH,actualSum:ROUGH,delta:0,color:'#C8A97E'},...state.cats.map(c=>{let cc=calcCat(c);return{name:c.icon+' '+c.name,...cc,color:c.color}})].map(i=>`<div style="padding:10px 0;border-bottom:1px solid #F5F0E8"><div class="row"><div><span style="font-size:15px">${esc(i.name)}</span></div><div style="text-align:right"><div class="mono" style="font-size:13px">${fmt(i.planned)}</div>${i.delta?`<span class="delta ${i.delta>0?'red':'green'}">${i.delta>0?'🔴 +':'🟢 '}${fmt(Math.abs(i.delta))}</span>`:''}</div></div><div class="bar"><div class="fill" style="background:${i.color};width:${Math.min(100,i.actualSum/(i.planned||1)*100)}%"></div></div></div>`).join('')}</div><div class="card" style="background:#F2F8F3;border:2px solid #A3C8A8"><div class="row"><div><div class="mini ok">🛡 РЕЗЕРВНЫЙ ФОНД</div><div style="font-size:32px;font-weight:300">${fmt(p.reserve)}</div><div class="mini">базовый ${fmt(BASE_RESERVE)}</div></div><div style="text-align:right"><div class="mono ok">+${fmt(p.savings)} экономия</div><div class="mono danger">−${fmt(p.overruns)} перерасход</div></div></div></div><div class="card" style="background:#FDF5E4;border:1px solid #E8D8A0"><div class="mini warn">ЛОГИКА РАСЧЁТА</div><p style="margin-top:8px;line-height:1.7">Если «Оплачено» заполнено — резерв считается по нему. Если нет, но заполнено «Подобрано» — по нему. Если оба поля пустые — по плану.</p></div></div>`}
function rough(){return `<div class="wrap">${roughGroups.map(([g,a])=>`<div class="card"><div class="row"><b style="font-size:17px">${g}</b><span class="mono">${fmt(a)}</span></div><div class="bar"><div class="fill" style="width:${a/385420*100}%"></div></div></div>`).join('')}<div class="card" style="background:#EDE7DC"><div class="row"><span class="mono">ИТОГО</span><b class="mono">${fmt(ROUGH)}</b></div></div></div>`}
function flexible(){const cats=filteredCats();return `<div class="wrap"><div class="card"><div class="mini" style="margin-bottom:8px">ФИЛЬТРЫ</div><div>${[{id:'all',label:'Все',icon:''},...rooms].map(r=>`<button class="pill ${state.filterRoom===r.id?'on':''}" data-filter-room="${r.id}">${r.icon} ${r.label}</button>`).join('')}</div><div style="margin-top:7px">${[{id:'all',label:'Все'},...statuses].map(s=>`<button class="pill ${state.filterStatus===s.id?'on':''}" data-filter-status="${s.id}">${s.label}</button>`).join('')}</div><div style="margin-top:7px">${[{id:'all',name:'Все',icon:''},...state.cats].map(c=>`<button class="pill ${state.filterCat===c.id?'on':''}" data-filter-cat="${c.id}">${c.icon} ${c.name}</button>`).join('')}</div></div>${cats.map(cat=>catBlock(cat)).join('')}${!IS_VIEWER?'<button class="btn dash" style="width:100%;padding:12px" data-act="addCat">+ добавить категорию</button>':''}</div>`}
function catBlock(cat){let cc=calcCat(cat), open=state.openCats[cat.id];return `<div class="card"><div class="row"><button class="catHead" data-open-cat="${cat.id}">${open?'▾':'▸'} ${cat.icon} ${esc(cat.name)}</button></div><div class="grid4" style="margin-top:10px"><div class="amountBox"><div class="l">Запланировано</div><div class="v">${fmtK(cc.planned)}</div></div><div class="amountBox"><div class="l">Фактически</div><div class="v">${fmtK(cc.actualSum)}</div></div><div class="amountBox"><div class="l">Оплачено</div><div class="v">${fmtK(cc.paid)}</div></div><div class="amountBox"><div class="l">Разница</div><div class="v ${cc.delta>0?'danger':cc.delta<0?'ok':''}">${cc.delta?((cc.delta>0?'+':'−')+fmt(Math.abs(cc.delta))):'—'}</div></div></div>${open?`<div>${cat.subs.map(s=>subBlock(cat.id,s)).join('')}${!IS_VIEWER?`<button class="btn dash" data-add-sub="${cat.id}" style="width:100%;margin-top:8px">+ подкатегория</button>`:''}</div>`:''}</div>`}
function subBlock(cid,s){let open=state.openSubs[s.id], st=smap[s.status]||smap.none; let roomsHtml=(s.roomIds||[]).map(id=>rmap[id]?`<span class="pill">${rmap[id].icon} ${rmap[id].label}</span>`:'').join(''); return `<div class="sub"><div class="row"><div style="flex:1"><button class="catHead subTitle" data-open-sub="${s.id}">${open?'▾':'▸'} ${esc(s.name)}</button> ${deltaBadge(s)} <span class="status" style="background:${st.bg};color:${st.color}">${st.label}</span><div>${roomsHtml}</div></div>${!IS_VIEWER?`<button class="btn" data-del-sub="${cid}|${s.id}">🗑</button>`:''}</div>${open?subEdit(cid,s):''}</div>`}
function subEdit(cid,s){return `<div style="margin-top:10px">${!IS_VIEWER?`<div class="field"><label>Название</label><input data-input="${cid}|${s.id}|name" value="${esc(s.name)}"></div>`:''}<div class="inputs"><div class="field"><label>ЗАПЛАНИРОВАНО</label><input type="number" ${IS_VIEWER?'disabled':''} data-input="${cid}|${s.id}|planned" value="${s.planned||''}"></div><div class="field"><label>ПОДОБРАНО</label><input type="number" ${IS_VIEWER?'disabled':''} data-input="${cid}|${s.id}|selected" value="${s.selected||''}"></div><div class="field"><label>ОПЛАЧЕНО</label><input type="number" ${IS_VIEWER?'disabled':''} data-input="${cid}|${s.id}|paid" value="${s.paid||''}"></div></div>${!IS_VIEWER?`<div class="field"><label>Статус</label><select data-input="${cid}|${s.id}|status">${statuses.map(st=>`<option value="${st.id}" ${s.status===st.id?'selected':''}>${st.label}</option>`).join('')}</select></div><div class="field"><label>Ссылка</label><input data-input="${cid}|${s.id}|url" value="${esc(s.url)}"></div><div class="field"><label>Ссылка на картинку</label><input data-input="${cid}|${s.id}|imageUrl" value="${esc(s.imageUrl)}"></div><div class="field"><label>Комментарий</label><textarea data-input="${cid}|${s.id}|comment">${esc(s.comment)}</textarea></div><div class="mini" style="margin:8px 0 4px">ПОМЕЩЕНИЯ</div><div>${rooms.map(r=>`<button class="pill ${(s.roomIds||[]).includes(r.id)?'on':''}" data-room-toggle="${cid}|${s.id}|${r.id}">${r.icon} ${r.label}</button>`).join('')}</div>`:''}${s.url?`<p style="margin-top:10px"><a href="${esc(s.url)}" target="_blank" style="color:#5A9AB8">🔗 открыть товар</a></p>`:''}${s.imageUrl?`<img src="${esc(s.imageUrl)}" style="margin-top:10px;max-width:180px;max-height:140px;object-fit:contain;background:#F9F6F1;border:1px solid #EDE7DC;border-radius:8px">`:''}</div>`}
function chart(){return `<div class="wrap"><div class="card"><div class="mini" style="margin-bottom:14px">ДИАГРАММА</div>${[{name:'Черновые работы',planned:ROUGH,actualSum:ROUGH,color:'#C8A97E'},...state.cats.map(c=>({name:c.icon+' '+c.name,color:c.color,...calcCat(c)}))].sort((a,b)=>b.planned-a.planned).map(i=>`<div style="margin-bottom:14px"><div class="row"><span>${esc(i.name)}</span><span class="mono">${fmt(i.planned)}</span></div><div class="bar" style="height:16px"><div class="fill" style="background:${i.color};width:${Math.min(100,i.planned/ROUGH*100)}%"></div></div></div>`).join('')}</div></div>`}
function drawHeaderOnly(){/* keep simple */}
function draw(){if(!state.cats)return; try{document.getElementById('app').innerHTML=header()+(state.tab==='overview'?overview():state.tab==='rough'?rough():state.tab==='flexible'?flexible():chart()); bind()}catch(e){document.getElementById('app').innerHTML=`<div style="padding:24px;font-family:Arial"><h2>Ошибка рендера</h2><pre>${esc(e.stack||e.message||e)}</pre><button onclick="localStorage.removeItem('${DB_KEY}');location.href=location.pathname+'?reset'">Сбросить данные</button></div>`}}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;draw()}); document.querySelectorAll('[data-open-cat]').forEach(b=>b.onclick=()=>{state.openCats[b.dataset.openCat]=!state.openCats[b.dataset.openCat];draw()}); document.querySelectorAll('[data-open-sub]').forEach(b=>b.onclick=()=>{state.openSubs[b.dataset.openSub]=!state.openSubs[b.dataset.openSub];draw()}); document.querySelectorAll('[data-filter-room]').forEach(b=>b.onclick=()=>{state.filterRoom=b.dataset.filterRoom;draw()}); document.querySelectorAll('[data-filter-status]').forEach(b=>b.onclick=()=>{state.filterStatus=b.dataset.filterStatus;draw()}); document.querySelectorAll('[data-filter-cat]').forEach(b=>b.onclick=()=>{state.filterCat=b.dataset.filterCat;draw()}); document.querySelectorAll('[data-add-sub]').forEach(b=>b.onclick=()=>addSub(b.dataset.addSub)); document.querySelectorAll('[data-del-sub]').forEach(b=>b.onclick=()=>{let [c,s]=b.dataset.delSub.split('|');delSub(c,s)}); document.querySelectorAll('[data-room-toggle]').forEach(b=>b.onclick=()=>{let [cid,sid,rid]=b.dataset.roomToggle.split('|');let sub=state.cats.find(c=>c.id===cid).subs.find(s=>s.id===sid);let ids=sub.roomIds||[]; if(rid==='common')ids=ids.includes('common')?[]:['common']; else ids=ids.includes(rid)?ids.filter(x=>x!==rid):[...ids.filter(x=>x!=='common'),rid]; updateSub(cid,sid,{roomIds:ids})}); document.querySelectorAll('[data-input]').forEach(el=>{el.onchange=()=>{let [cid,sid,field]=el.dataset.input.split('|'); let val=['planned','selected','paid'].includes(field)?Math.max(0,n(el.value)):el.value; updateSub(cid,sid,{[field]:val})}}); document.querySelectorAll('[data-act="addCat"]').forEach(b=>b.onclick=addCat); document.querySelectorAll('[data-act="export"]').forEach(b=>b.onclick=()=>{let txt=JSON.stringify({cats:state.cats,exportedAt:new Date().toISOString()},null,2); let blob=new Blob([txt],{type:'application/json'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='ilusha-design-budget.json'; a.click()}); document.querySelectorAll('[data-act="import"]').forEach(b=>b.onclick=()=>document.getElementById('importFile').click()); let imp=document.getElementById('importFile'); if(imp)imp.onchange=e=>{let f=e.target.files[0]; if(!f)return; let r=new FileReader(); r.onload=ev=>{try{let d=JSON.parse(ev.target.result); state.cats=normalizeCats(d.cats); draw(); save()}catch(err){alert('Ошибка импорта: '+err.message)}}; r.readAsText(f)}}
window.addEventListener('firebase-ready',()=>load()); setTimeout(()=>{if(!state.cats)load()},2500);
})();
</script>
</body>
</html>
